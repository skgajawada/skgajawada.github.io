      #
      # PDF files are NOT staged.
      # =========================================================

      - name: Stage generated web reader files
        shell: bash

        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "Staging generated web reader files"
          echo "=========================================="


          # -----------------------------------------------------
          # Stage tracked modifications/deletions
          # -----------------------------------------------------

          git add -u -- assets/teaching


          # -----------------------------------------------------
          # Stage generated page images
          # -----------------------------------------------------

          if [ -s tex_to_build.txt ]; then


            while IFS= read -r texfile

            do

              dir=$(dirname "$texfile")
              name=$(basename "$texfile" .tex)

              page_dir="$dir/$name-pages"
              reader="$dir/$name-reader.html"


              # -------------------------------------------------
              # Stage ALL page images
              # -------------------------------------------------

              if [ -d "$page_dir" ]; then

                echo ""
                echo "Staging pages:"
                echo "$page_dir"


                git add -f \
                  "$page_dir"/*.jpg

              fi


              # -------------------------------------------------
              # Stage reader
              # -------------------------------------------------

              if [ -f "$reader" ]; then

                echo ""
                echo "Staging reader:"
                echo "$reader"


                git add -f "$reader"

              fi


            done < tex_to_build.txt

          fi


          # -----------------------------------------------------
          # Stage PPT index
          # -----------------------------------------------------

          PPT_INDEX="assets/teaching/Engineering Graphics/PPT/index.html"


          if [ -f "$PPT_INDEX" ]; then

            echo ""
            echo "Staging PPT index:"
            echo "$PPT_INDEX"


            git add "$PPT_INDEX"

          fi


          # -----------------------------------------------------
          # Safety check:
          #
          # DO NOT allow PDFs to be committed.
          # -----------------------------------------------------

          echo ""
          echo "=========================================="
          echo "Checking for staged PDF files"
          echo "=========================================="


          staged_pdfs=$(
            git diff \
              --cached \
              --name-only \
              -- '*.pdf' \
              '*.PDF'
          )


          if [ -n "$staged_pdfs" ]; then

            echo ""
            echo "ERROR:"
            echo "A PDF file is staged for publication:"
            echo ""

            echo "$staged_pdfs"

            echo ""

            echo "Removing staged PDF files..."


            while IFS= read -r pdf

            do

              if [ -n "$pdf" ]; then

                git restore \
                  --staged \
                  -- "$pdf" || true

              fi

            done <<< "$staged_pdfs"


            echo ""
            echo "PDF publication blocked."

          fi


          # -----------------------------------------------------
          # Final Git status
          # -----------------------------------------------------

          echo ""
          echo "=========================================="
          echo "Final Git status"
          echo "=========================================="

          git status --short


      # =========================================================
      # 12. FINAL PDF SAFETY CHECK
      #
      # Absolutely no generated PDF should exist in the
      # repository after this point.
      # =========================================================

      - name: Final PDF safety check
        shell: bash

        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "FINAL PDF SAFETY CHECK"
          echo "=========================================="


          staged_pdfs=$(
            git diff \
              --cached \
              --name-only \
              -- '*.pdf' \
              '*.PDF'
          )


          if [ -n "$staged_pdfs" ]; then

            echo ""
            echo "ERROR: PDF detected in staged changes."
            echo "$staged_pdfs"

            exit 1

          fi


          echo ""
          echo "SUCCESS:"
          echo "No PDF files are staged for publication."


      # =========================================================
      # 13. COMMIT AND PUSH
      # =========================================================

      - name: Commit and push web reader
        shell: bash

        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "Checking for changes"
          echo "=========================================="


          if git diff --cached --quiet; then

            echo ""
            echo "No changes to commit."

            exit 0

          fi


          # -----------------------------------------------------
          # Git identity
          # -----------------------------------------------------

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # -----------------------------------------------------
          # Commit
          # -----------------------------------------------------

          git commit \
            -m "Update teaching material web reader [skip ci]"


          # -----------------------------------------------------
          # Push
          # -----------------------------------------------------

          git push
