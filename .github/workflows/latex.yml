name: Build Teaching Material Web Reader

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT REPOSITORY
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # =========================================================
      # 2. INSTALL PDF / IMAGE TOOLS
      # =========================================================

      - name: Install PDF tools
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            poppler-utils \
            imagemagick


      # =========================================================
      # 3. DETECT CHANGED / DELETED TEX FILES
      # =========================================================

      - name: Detect changed LaTeX files
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Detecting LaTeX files"
          echo "=========================================="

          # -----------------------------------------------------
          # MANUAL WORKFLOW RUN
          #
          # Processes ALL teaching TEX files.
          # Useful for the first conversion of existing material.
          # -----------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo ""
            echo "Manual workflow run detected."
            echo "All teaching TEX files will be processed."
            echo ""

            find assets/teaching \
              -type f \
              -name "*.tex" \
              -print \
              > tex_to_build.txt

            : > tex_to_delete.txt

          else

            # ---------------------------------------------------
            # NORMAL PUSH
            #
            # Only changed TEX files are processed.
            # ---------------------------------------------------

            echo ""
            echo "Automatic push detected."
            echo ""

            git diff \
              --name-status \
              "${{ github.event.before }}" \
              "${{ github.sha }}" \
              -- assets/teaching \
              > changed_teaching_files.txt

            echo ""
            echo "=========================================="
            echo "Changed teaching files"
            echo "=========================================="

            if [ -s changed_teaching_files.txt ]; then
              cat changed_teaching_files.txt
            else
              echo "No teaching files changed."
            fi


            # ---------------------------------------------------
            # NEW / MODIFIED TEX
            # ---------------------------------------------------

            awk '
              ($1 == "A" || $1 == "M") && ($2 ~ /\.tex$/) {
                print $2
              }
            ' changed_teaching_files.txt \
              > tex_to_build.txt


            # ---------------------------------------------------
            # DELETED TEX
            # ---------------------------------------------------

            awk '
              $1 == "D" && ($2 ~ /\.tex$/) {
                print $2
              }
            ' changed_teaching_files.txt \
              > tex_to_delete.txt

          fi


          echo ""
          echo "=========================================="
          echo "TEX FILES TO BUILD"
          echo "=========================================="

          if [ -s tex_to_build.txt ]; then
            cat tex_to_build.txt
          else
            echo "No TEX files need to be built."
          fi


          echo ""
          echo "=========================================="
          echo "TEX FILES DELETED"
          echo "=========================================="

          if [ -s tex_to_delete.txt ]; then
            cat tex_to_delete.txt
          else
            echo "No TEX files deleted."
          fi


      # =========================================================
      # 4. COMPILE TEX → FULL PDF
      #
      # The PDF exists ONLY temporarily on the GitHub Actions
      # runner.
      #
      # It is NEVER published.
      # =========================================================

      - name: Compile required LaTeX files
        uses: xu-cheng/texlive-action@v3

        with:

          run: |

            set -e

            if [ ! -s tex_to_build.txt ]; then

              echo "No TEX files need compilation."

              exit 0

            fi


            while IFS= read -r file

            do

              echo ""
              echo "=========================================="
              echo "Compiling:"
              echo "$file"
              echo "=========================================="


              dir=$(dirname "$file")
              name=$(basename "$file" .tex)


              cd "$dir"


              # -------------------------------------------------
              # Compile complete original presentation
              # -------------------------------------------------

              latexmk \
                -pdf \
                -g \
                -interaction=nonstopmode \
                -halt-on-error \
                "$name.tex"


              cd - > /dev/null


            done < tex_to_build.txt


      # =========================================================
      # 5. RENDER EVERY PDF PAGE AS AN IMAGE
      #
      # IMPORTANT:
      #
      # We do NOT create a preview PDF.
      #
      # Every page of the complete presentation is rendered.
      #
      # Example:
      #
      #     cycloid.pdf
      #
      # becomes:
      #
      #     cycloid-pages/
      #       page-001.jpg
      #       page-002.jpg
      #       ...
      #       page-076.jpg
      #
      # The watermark already exists inside the PDF because it
      # was added in the TEX source.
      # =========================================================

      - name: Render every PDF page
        shell: bash

        run: |

          set -e


          if [ ! -s tex_to_build.txt ]; then

            echo "No TEX files need rendering."

            exit 0

          fi


          while IFS= read -r texfile

          do

            echo ""
            echo "=========================================="
            echo "Rendering presentation pages"
            echo "=========================================="


            dir=$(dirname "$texfile")
            name=$(basename "$texfile" .tex)

            full_pdf="$dir/$name.pdf"
            page_dir="$dir/$name-pages"


            echo "TEX:"
            echo "$texfile"

            echo ""

            echo "Temporary PDF:"
            echo "$full_pdf"

            echo ""

            echo "Public page directory:"
            echo "$page_dir"


            # ---------------------------------------------------
            # Verify PDF exists
            # ---------------------------------------------------

            if [ ! -f "$full_pdf" ]; then

              echo ""
              echo "ERROR: PDF was not generated."
              echo "$full_pdf"

              exit 1

            fi


            # ---------------------------------------------------
            # Determine number of pages
            # ---------------------------------------------------

            page_count=$(
              pdfinfo "$full_pdf" |
              awk '/^Pages:/ {print $2}'
            )


            echo ""
            echo "Total pages:"
            echo "$page_count"


            # ---------------------------------------------------
            # Remove old generated page images
            # ---------------------------------------------------

            rm -rf "$page_dir"

            mkdir -p "$page_dir"


            # ---------------------------------------------------
            # Render ALL pages
            #
            # 120 DPI gives good screen quality while keeping
            # GitHub repository size reasonable.
            #
            # JPEG quality = 90
            # ---------------------------------------------------

            pdftoppm \
              -jpeg \
              -r 120 \
              -jpegopt quality=90 \
              "$full_pdf" \
              "$page_dir/page"


            # ---------------------------------------------------
            # Rename generated files to:
            #
            # page-001.jpg
            # page-002.jpg
            # ...
            #
            # instead of:
            #
            # page-1.jpg
            # page-2.jpg
            # ---------------------------------------------------

            python3 << PYTHON

from pathlib import Path

page_dir = Path(r"$page_dir")

files = sorted(
    page_dir.glob("page-*.jpg"),
    key=lambda p: int(p.stem.split("-")[-1])
)

for i, old_file in enumerate(files, start=1):

    new_file = page_dir / f"page-{i:03d}.jpg"

    old_file.rename(new_file)

print(f"Rendered {len(files)} page(s).")

PYTHON


            echo ""
            echo "Pages generated:"
            find "$page_dir" \
              -type f \
              -name "*.jpg" \
              | sort


          done < tex_to_build.txt


      # =========================================================
      # 6. GENERATE CUSTOM KINDLE-STYLE WEB READER
      #
      # One reader.html is generated for every presentation.
      #
      # The reader:
      #
      #   • displays one page at a time
      #   • previous button
      #   • next button
      #   • page number
      #   • fullscreen button
      #   • keyboard navigation
      #   • no PDF
      #   • no PDF download button
      #   • no browser PDF viewer
      #
      # IMPORTANT:
      #
      # This is NOT a PDF viewer.
      #
      # It is an IMAGE-BASED PRESENTATION READER.
      # =========================================================

      - name: Generate custom web readers
        shell: bash

        run: |

          set -e


          if [ ! -s tex_to_build.txt ]; then

            echo "No readers need to be generated."

            exit 0

          fi


          while IFS= read -r texfile

          do

            echo ""
            echo "=========================================="
            echo "Generating custom web reader"
            echo "=========================================="


            dir=$(dirname "$texfile")
            name=$(basename "$texfile" .tex)

            page_dir="$dir/$name-pages"
            reader="$dir/$name-reader.html"


            if [ ! -d "$page_dir" ]; then

              echo "ERROR: Page directory not found:"
              echo "$page_dir"

              exit 1

            fi


            # ---------------------------------------------------
            # Generate JSON list of pages
            # ---------------------------------------------------

            python3 << PYTHON

from pathlib import Path
from html import escape

page_dir = Path(r"$page_dir")
reader = Path(r"$reader")

pages = sorted(
    page_dir.glob("page-*.jpg"),
    key=lambda p: int(p.stem.split("-")[-1])
)

if not pages:
    raise SystemExit("ERROR: No rendered pages found.")

page_urls = [
    f"{page_dir.name}/{p.name}"
    for p in pages
]

title = "$name"

title = title.replace("_", " ")
title = title.replace("-", " ")

title = " ".join(title.split()).title()

pages_js = ",\n".join(
    "            " + repr(p)
    for p in page_urls
)

html = f'''<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>{escape(title)} — Gajavada Sanjeevkumar</title>


<style>

* {{
    box-sizing: border-box;
}}


html,
body {{
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}}


.reader {{
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background: #111;
}}


/* =========================================================
   SLIDE AREA
   ========================================================= */

.slide-area {{

    flex: 1;

    min-height: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10px;

    overflow: hidden;
}}


#slideImage {{

    max-width: 100%;

    max-height: 100%;

    width: auto;

    height: auto;

    object-fit: contain;

    display: block;

    user-select: none;

    -webkit-user-drag: none;

    box-shadow:
        0 4px 25px
        rgba(0,0,0,0.5);
}}


/* =========================================================
   CONTROL BAR
   ========================================================= */

.controls {{

    height: 58px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    padding: 8px 15px;

    background: #181818;

    border-top:
        1px solid #333;
}}


.control-button {{

    border: none;

    outline: none;

    background: #2b2b2b;

    color: white;

    min-width: 42px;

    height: 40px;

    padding: 0 13px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 18px;

    transition:
        background 0.2s ease,
        transform 0.1s ease;
}}


.control-button:hover {{
    background: #444;
}}


.control-button:active {{
    transform: scale(0.95);
}}


.page-counter {{

    color: #ddd;

    min-width: 90px;

    text-align: center;

    font-size: 15px;

    font-weight: 600;
}}


/* =========================================================
   TITLE
   ========================================================= */

.reader-title {{

    position: absolute;

    top: 10px;

    left: 15px;

    z-index: 10;

    color: rgba(255,255,255,0.75);

    font-size: 13px;

    pointer-events: none;
}}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {{

    .slide-area {{
        padding: 4px;
    }}

    .controls {{
        height: 54px;

        gap: 8px;
    }}

    .control-button {{
        min-width: 38px;

        height: 38px;

        padding: 0 10px;
    }}

    .page-counter {{
        min-width: 75px;

        font-size: 14px;
    }}

}}

</style>

</head>


<body>


<div class="reader">


    <div class="reader-title">
        {escape(title)}
    </div>


    <div
        class="slide-area"
        id="slideArea"
    >

        <img
            id="slideImage"
            alt="Presentation slide"
            draggable="false"
        >

    </div>


    <div class="controls">


        <button
            class="control-button"
            id="previousButton"
            title="Previous slide"
            aria-label="Previous slide"
        >
            &#10094;
        </button>


        <div
            class="page-counter"
            id="pageCounter"
        >
            1 / {len(page_urls)}
        </div>


        <button
            class="control-button"
            id="nextButton"
            title="Next slide"
            aria-label="Next slide"
        >
            &#10095;
        </button>


        <button
            class="control-button"
            id="fullscreenButton"
            title="Fullscreen"
            aria-label="Fullscreen"
        >
            &#x26F6;
        </button>


    </div>


</div>


<script>

const pages = [
{pages_js}
];


let currentPage = 0;


const image =
    document.getElementById("slideImage");

const counter =
    document.getElementById("pageCounter");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const slideArea =
    document.getElementById("slideArea");


/* =========================================================
   LOAD PAGE
   ========================================================= */

function showPage(index) {{

    if (index < 0) {{
        index = 0;
    }}

    if (index >= pages.length) {{
        index = pages.length - 1;
    }}

    currentPage = index;

    image.src = pages[currentPage];

    counter.textContent =
        (currentPage + 1)
        + " / "
        + pages.length;


    previousButton.disabled =
        currentPage === 0;

    nextButton.disabled =
        currentPage === pages.length - 1;

}}


/* =========================================================
   PREVIOUS
   ========================================================= */

previousButton.addEventListener(
    "click",
    function() {{

        showPage(currentPage - 1);

    }}
);


/* =========================================================
   NEXT
   ========================================================= */

nextButton.addEventListener(
    "click",
    function() {{

        showPage(currentPage + 1);

    }}
);


/* =========================================================
   KEYBOARD NAVIGATION
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {{

        if (
            event.key === "ArrowLeft" ||
            event.key === "PageUp"
        ) {{

            showPage(currentPage - 1);

        }}


        else if (
            event.key === "ArrowRight" ||
            event.key === "PageDown" ||
            event.key === " "
        ) {{

            event.preventDefault();

            showPage(currentPage + 1);

        }}


        else if (
            event.key === "Home"
        ) {{

            showPage(0);

        }}


        else if (
            event.key === "End"
        ) {{

            showPage(pages.length - 1);

        }}

    }}
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

fullscreenButton.addEventListener(
    "click",
    function() {{

        if (!document.fullscreenElement) {{

            if (document.documentElement.requestFullscreen) {{

                document.documentElement.requestFullscreen();

            }}

        }}

        else {{

            if (document.exitFullscreen) {{

                document.exitFullscreen();

            }}

        }}

    }}
);


/* =========================================================
   DISABLE RIGHT CLICK ON SLIDE
   ========================================================= */

image.addEventListener(
    "contextmenu",
    function(event) {{

        event.preventDefault();

    }}
);


/* =========================================================
   TOUCH / SWIPE SUPPORT
   ========================================================= */

let touchStartX = 0;
let touchEndX = 0;


slideArea.addEventListener(
    "touchstart",
    function(event) {{

        touchStartX =
            event.changedTouches[0].screenX;

    }},
    {{ passive: true }}
);


slideArea.addEventListener(
    "touchend",
    function(event) {{

        touchEndX =
            event.changedTouches[0].screenX;

        const distance =
            touchEndX - touchStartX;


        if (Math.abs(distance) < 50) {{
            return;
        }}


        if (distance < 0) {{

            showPage(currentPage + 1);

        }}

        else {{

            showPage(currentPage - 1);

        }}

    }},
    {{ passive: true }}
);


/* =========================================================
   START
   ========================================================= */

showPage(0);

</script>


</body>

</html>
'''

reader.write_text(
    html,
    encoding="utf-8"
)

print(
    f"Created reader: {{reader}}"
)

print(
    f"Pages: {{len(pages)}}"
)

