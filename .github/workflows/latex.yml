name: Build Teaching Presentation PDFs

run-name: Build Teaching Presentation PDFs

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent two builds from modifying the repository simultaneously.
concurrency:
  group: teaching-presentation-build
  cancel-in-progress: false

permissions:
  contents: write


jobs:

  build-pdf:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT REPOSITORY
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================================
      # 2. DETECT TEX FILES THAT NEED TO BE BUILT
      #
      # Normal push:
      #   Build only added/modified TEX files.
      #
      # Manual run:
      #   Build all teaching TEX files.
      #
      # Workflow modification:
      #   Build all teaching TEX files.
      # =========================================================

      - name: Detect LaTeX files
        shell: bash
        run: |

          set -euo pipefail

          echo "=================================================="
          echo "Teaching Presentation PDF Builder"
          echo "=================================================="

          # -----------------------------------------------------
          # Initialize lists
          # -----------------------------------------------------

          : > tex_to_build.txt
          : > tex_to_delete.txt


          # =====================================================
          # MANUAL WORKFLOW RUN
          # =====================================================

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo ""
            echo "Manual workflow run detected."
            echo "All teaching TEX files will be compiled."
            echo ""

            find "assets/teaching" \
              -type f \
              -name "*.tex" \
              -print \
              | sort \
              > tex_to_build.txt


          else

            # ===================================================
            # AUTOMATIC PUSH
            # ===================================================

            echo ""
            echo "Automatic push detected."
            echo ""

            workflow_changed=false


            # ---------------------------------------------------
            # Check whether this workflow changed.
            # If yes, rebuild everything.
            # ---------------------------------------------------

            if git diff \
              --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}" \
              | grep -Fxq ".github/workflows/latex.yml"; then

              workflow_changed=true

            fi


            if [ "$workflow_changed" = "true" ]; then

              echo "The LaTeX workflow was modified."
              echo "All teaching TEX files will be rebuilt."
              echo ""

              find "assets/teaching" \
                -type f \
                -name "*.tex" \
                -print \
                | sort \
                > tex_to_build.txt

            else

              # -------------------------------------------------
              # Detect changed teaching files
              # -------------------------------------------------

              git diff \
                --name-status \
                "${{ github.event.before }}" \
                "${{ github.sha }}" \
                -- "assets/teaching" \
                > changed_teaching_files.txt


              echo "=================================================="
              echo "Changed teaching files"
              echo "=================================================="

              if [ -s changed_teaching_files.txt ]; then

                cat changed_teaching_files.txt

              else

                echo "No teaching files changed."

              fi


              # -------------------------------------------------
              # Added / Modified TEX
              # -------------------------------------------------

              awk '
                ($1 == "A" || $1 == "M") && ($2 ~ /\.tex$/) {
                  print $2
                }
              ' changed_teaching_files.txt \
              | sort -u \
              > tex_to_build.txt


              # -------------------------------------------------
              # Deleted TEX
              # -------------------------------------------------

              awk '
                $1 == "D" && ($2 ~ /\.tex$/) {
                  print $2
                }
              ' changed_teaching_files.txt \
              | sort -u \
              > tex_to_delete.txt

            fi

          fi


          echo ""
          echo "=================================================="
          echo "TEX FILES TO BUILD"
          echo "=================================================="

          if [ -s tex_to_build.txt ]; then

            cat tex_to_build.txt

          else

            echo "No TEX files need to be built."

          fi


          echo ""
          echo "=================================================="
          echo "TEX FILES DELETED"
          echo "=================================================="

          if [ -s tex_to_delete.txt ]; then

            cat tex_to_delete.txt

          else

            echo "No TEX files deleted."

          fi


      # =========================================================
      # 3. COMPILE TEX → PDF
      #
      # The generated PDF remains in the same directory as the
      # source TEX file.
      #
      # Example:
      #
      # PPT/cycloid/cycloid.tex
      #          ↓
      # PPT/cycloid/cycloid.pdf
      # =========================================================

      - name: Compile LaTeX presentations
        uses: xu-cheng/texlive-action@v3

        with:
          run: |

            set -euo pipefail


            if [ ! -s tex_to_build.txt ]; then

              echo "No TEX files require compilation."

              exit 0

            fi


            while IFS= read -r texfile
            do

              [ -z "$texfile" ] && continue


              echo ""
              echo "=================================================="
              echo "Compiling presentation"
              echo "=================================================="

              echo "Source:"
              echo "$texfile"


              # -------------------------------------------------
              # Determine directory and filename
              # -------------------------------------------------

              directory="$(dirname "$texfile")"
              filename="$(basename "$texfile" .tex)"


              echo ""
              echo "Directory:"
              echo "$directory"

              echo ""
              echo "Filename:"
              echo "$filename"


              # -------------------------------------------------
              # Enter presentation directory
              #
              # This safely handles spaces in paths.
              # -------------------------------------------------

              cd "$directory"


              # -------------------------------------------------
              # Compile complete Beamer presentation
              # -------------------------------------------------

              latexmk \
                -pdf \
                -g \
                -interaction=nonstopmode \
                -halt-on-error \
                "$filename.tex"


              # -------------------------------------------------
              # Verify generated PDF
              # -------------------------------------------------

              if [ ! -f "$filename.pdf" ]; then

                echo ""
                echo "ERROR: PDF was not generated."

                echo "Expected:"
                echo "$filename.pdf"

                exit 1

              fi


              echo ""
              echo "PDF successfully generated:"
              echo "$directory/$filename.pdf"


              cd - > /dev/null


            done < tex_to_build.txt


      # =========================================================
      # 4. REMOVE OLD IMAGE-BASED READER FILES
      #
      # The previous workflow generated:
      #
      #     cycloid-pages/
      #     page-001.jpg
      #     page-002.jpg
      #     ...
      #
      # These are no longer required.
      #
      # The new reader will use:
      #
      #     cycloid.pdf
      #
      # through PDF.js.
      # =========================================================

      - name: Remove old image-based presentation files
        shell: bash
        run: |

          set -euo pipefail


          echo ""
          echo "=================================================="
          echo "Removing old image-based presentation files"
          echo "=================================================="


          # -----------------------------------------------------
          # Remove old generated page directories
          # -----------------------------------------------------

          find "assets/teaching" \
            -type d \
            -name "*-pages" \
            -print \
            > old_page_directories.txt


          if [ -s old_page_directories.txt ]; then

            while IFS= read -r directory
            do

              [ -z "$directory" ] && continue

              echo ""
              echo "Removing:"
              echo "$directory"


              git rm \
                -r \
                --cached \
                --ignore-unmatch \
                "$directory" || true


              rm -rf "$directory"

            done < old_page_directories.txt

          else

            echo "No old page directories found."

          fi


          # -----------------------------------------------------
          # Remove old preview PDFs
          # -----------------------------------------------------

          find "assets/teaching" \
            -type f \
            \( \
              -name "*-preview.pdf" \
              -o \
              -name "*-preview.PDF" \
            \) \
            -print \
            > old_preview_files.txt


          if [ -s old_preview_files.txt ]; then

            while IFS= read -r preview
            do

              [ -z "$preview" ] && continue

              echo ""
              echo "Removing old preview PDF:"
              echo "$preview"


              git rm \
                --cached \
                --ignore-unmatch \
                "$preview" || true


              rm -f "$preview"

            done < old_preview_files.txt

          else

            echo "No old preview PDFs found."

          fi


      # =========================================================
      # 5. REMOVE GENERATED FILES FOR DELETED TEX
      #
      # If:
      #
      #     cycloid.tex
      #
      # is deleted, remove:
      #
      #     cycloid.pdf
      #
      # The manually maintained reader is NOT automatically
      # deleted.
      # =========================================================

      - name: Clean files for deleted LaTeX sources
        shell: bash
        run: |

          set -euo pipefail


          if [ ! -s tex_to_delete.txt ]; then

            echo "No deleted TEX files."

            exit 0

          fi


          while IFS= read -r texfile
          do

            [ -z "$texfile" ] && continue


            directory="$(dirname "$texfile")"
            filename="$(basename "$texfile" .tex)"

            pdf_file="$directory/$filename.pdf"


            echo ""
            echo "=================================================="
            echo "Removing generated PDF for deleted TEX"
            echo "=================================================="

            echo "$pdf_file"


            git rm \
              --cached \
              --ignore-unmatch \
              "$pdf_file" || true


            rm -f "$pdf_file"

          done < tex_to_delete.txt


      # =========================================================
      # 6. CLEAN LATEX AUXILIARY FILES
      #
      # Keep:
      #
      #     *.tex
      #     *.pdf
      #     manually maintained reader HTML
      #
      # Remove:
      #
      #     *.aux
      #     *.log
      #     *.nav
      #     *.out
      #     *.snm
      #     *.toc
      #     *.fls
      #     *.fdb_latexmk
      #     *.synctex.gz
      #     etc.
      # =========================================================

      - name: Clean LaTeX auxiliary files
        shell: bash
        run: |

          set -euo pipefail


          echo ""
          echo "=================================================="
          echo "Cleaning LaTeX auxiliary files"
          echo "=================================================="


          find "assets/teaching" \
            -type f \
            \( \
              -name "*.aux" \
              -o -name "*.log" \
              -o -name "*.nav" \
              -o -name "*.out" \
              -o -name "*.snm" \
              -o -name "*.toc" \
              -o -name "*.fls" \
              -o -name "*.fdb_latexmk" \
              -o -name "*.synctex.gz" \
              -o -name "*.vrb" \
              -o -name "*.xdv" \
              -o -name "*.bcf" \
              -o -name "*.run.xml" \
              -o -name "*.bbl" \
              -o -name "*.blg" \
              -o -name "*.lof" \
              -o -name "*.lot" \
              -o -name "*.idx" \
              -o -name "*.ilg" \
              -o -name "*.ind" \
            \) \
            -delete


          echo "LaTeX auxiliary files cleaned."


      # =========================================================
      # 7. STAGE GENERATED PDFs
      #
      # PDFs are intentionally published.
      #
      # This is required because the PDF.js reader loads:
      #
      #     cycloid.pdf
      #
      # from the same directory as:
      #
      #     cycloid-reader.html
      # =========================================================

      - name: Stage generated presentation PDFs
        shell: bash
        run: |

          set -euo pipefail


          echo ""
          echo "=================================================="
          echo "Staging generated PDFs"
          echo "=================================================="


          if [ -s tex_to_build.txt ]; then

            while IFS= read -r texfile
            do

              [ -z "$texfile" ] && continue


              directory="$(dirname "$texfile")"
              filename="$(basename "$texfile" .tex)"

              pdf_file="$directory/$filename.pdf"


              if [ ! -f "$pdf_file" ]; then

                echo ""
                echo "ERROR: Expected PDF not found:"
                echo "$pdf_file"

                exit 1

              fi


              echo ""
              echo "Staging:"
              echo "$pdf_file"


              # -f ensures the PDF is staged even if a previous
              # .gitignore contains a PDF rule.

              git add -f "$pdf_file"


            done < tex_to_build.txt

          fi


          # -----------------------------------------------------
          # Stage deletions/modifications
          # -----------------------------------------------------

          git add -u -- "assets/teaching"


      # =========================================================
      # 8. VERIFY THE FINAL PRESENTATION STRUCTURE
      # =========================================================

      - name: Verify generated presentation files
        shell: bash
        run: |

          set -euo pipefail


          echo ""
          echo "=================================================="
          echo "Generated presentation files"
          echo "=================================================="


          if [ -s tex_to_build.txt ]; then

            while IFS= read -r texfile
            do

              [ -z "$texfile" ] && continue


              directory="$(dirname "$texfile")"
              filename="$(basename "$texfile" .tex)"

              pdf_file="$directory/$filename.pdf"


              if [ ! -f "$pdf_file" ]; then

                echo ""
                echo "ERROR:"
                echo "Missing generated PDF:"
                echo "$pdf_file"

                exit 1

              fi


              echo ""
              echo "TEX : $texfile"
              echo "PDF : $pdf_file"


              # -------------------------------------------------
              # Display PDF size
              # -------------------------------------------------

              pdf_size=$(du -h "$pdf_file" | cut -f1)

              echo "Size: $pdf_size"


              # -------------------------------------------------
              # Display page count when pdfinfo is available.
              #
              # texlive-action provides the required PDF tools.
              # -------------------------------------------------

              if command -v pdfinfo >/dev/null 2>&1; then

                page_count=$(
                  pdfinfo "$pdf_file" |
                  awk '/^Pages:/ {print $2}'
                )

                echo "Pages: $page_count"

              fi


            done < tex_to_build.txt

          else

            echo "No new PDFs generated in this run."

          fi


      # =========================================================
      # 9. SHOW GIT STATUS
      # =========================================================

      - name: Show final Git status
        shell: bash
        run: |

          set -euo pipefail


          echo ""
          echo "=================================================="
          echo "FINAL GIT STATUS"
          echo "=================================================="


          git status --short


      # =========================================================
      # 10. COMMIT AND PUSH
      #
      # The generated PDF is committed to the repository.
      #
      # [skip ci] prevents the commit from triggering another
      # workflow run.
      # =========================================================

      - name: Commit and push generated PDFs
        shell: bash
        run: |

          set -euo pipefail


          echo ""
          echo "=================================================="
          echo "Checking for changes"
          echo "=================================================="


          if git diff --cached --quiet; then

            echo ""
            echo "No changes to commit."

            exit 0

          fi


          # -----------------------------------------------------
          # Configure Git identity
          # -----------------------------------------------------

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # -----------------------------------------------------
          # Commit
          # -----------------------------------------------------

          git commit \
            -m "Build teaching presentation PDFs [skip ci]"


          # -----------------------------------------------------
          # Push
          # -----------------------------------------------------

          git push


          echo ""
          echo "=================================================="
          echo "PDF BUILD COMPLETED SUCCESSFULLY"
          echo "=================================================="