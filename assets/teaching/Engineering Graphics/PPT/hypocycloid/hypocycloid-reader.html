<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Hypocycloid — Gajavada Sanjeevkumar</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


.reader {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background: #111;
}


/* =========================================================
   SLIDE AREA
   ========================================================= */

.slide-area {

    flex: 1;

    min-height: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10px;

    overflow: hidden;
}


#slideImage {

    max-width: 100%;

    max-height: 100%;

    width: auto;

    height: auto;

    object-fit: contain;

    display: block;

    user-select: none;

    -webkit-user-drag: none;

    box-shadow:
        0 4px 25px
        rgba(0,0,0,0.5);
}


/* =========================================================
   CONTROL BAR
   ========================================================= */

.controls {

    height: 58px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    padding: 8px 15px;

    background: #181818;

    border-top:
        1px solid #333;
}


.control-button {

    border: none;

    outline: none;

    background: #2b2b2b;

    color: white;

    min-width: 42px;

    height: 40px;

    padding: 0 13px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 18px;

    transition:
        background 0.2s ease,
        transform 0.1s ease;
}


.control-button:hover {
    background: #444;
}


.control-button:active {
    transform: scale(0.95);
}


.page-counter {

    color: #ddd;

    min-width: 90px;

    text-align: center;

    font-size: 15px;

    font-weight: 600;
}


/* =========================================================
   TITLE
   ========================================================= */

.reader-title {

    position: absolute;

    top: 10px;

    left: 15px;

    z-index: 10;

    color: rgba(255,255,255,0.75);

    font-size: 13px;

    pointer-events: none;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .slide-area {
        padding: 4px;
    }

    .controls {
        height: 54px;

        gap: 8px;
    }

    .control-button {
        min-width: 38px;

        height: 38px;

        padding: 0 10px;
    }

    .page-counter {
        min-width: 75px;

        font-size: 14px;
    }

}

</style>

</head>


<body>


<div class="reader">


    <div class="reader-title">
        Hypocycloid
    </div>


    <div
        class="slide-area"
        id="slideArea"
    >

        <img
            id="slideImage"
            alt="Presentation slide"
            draggable="false"
        >

    </div>


    <div class="controls">


        <button
            class="control-button"
            id="previousButton"
            title="Previous slide"
            aria-label="Previous slide"
        >
            &#10094;
        </button>


        <div
            class="page-counter"
            id="pageCounter"
        >
            1 / 64
        </div>


        <button
            class="control-button"
            id="nextButton"
            title="Next slide"
            aria-label="Next slide"
        >
            &#10095;
        </button>


        <button
            class="control-button"
            id="fullscreenButton"
            title="Fullscreen"
            aria-label="Fullscreen"
        >
            &#x26F6;
        </button>


    </div>


</div>


<script>

const pages = [
            'hypocycloid-pages/page-001.jpg',
            'hypocycloid-pages/page-002.jpg',
            'hypocycloid-pages/page-003.jpg',
            'hypocycloid-pages/page-004.jpg',
            'hypocycloid-pages/page-005.jpg',
            'hypocycloid-pages/page-006.jpg',
            'hypocycloid-pages/page-007.jpg',
            'hypocycloid-pages/page-008.jpg',
            'hypocycloid-pages/page-009.jpg',
            'hypocycloid-pages/page-010.jpg',
            'hypocycloid-pages/page-011.jpg',
            'hypocycloid-pages/page-012.jpg',
            'hypocycloid-pages/page-013.jpg',
            'hypocycloid-pages/page-014.jpg',
            'hypocycloid-pages/page-015.jpg',
            'hypocycloid-pages/page-016.jpg',
            'hypocycloid-pages/page-017.jpg',
            'hypocycloid-pages/page-018.jpg',
            'hypocycloid-pages/page-019.jpg',
            'hypocycloid-pages/page-020.jpg',
            'hypocycloid-pages/page-021.jpg',
            'hypocycloid-pages/page-022.jpg',
            'hypocycloid-pages/page-023.jpg',
            'hypocycloid-pages/page-024.jpg',
            'hypocycloid-pages/page-025.jpg',
            'hypocycloid-pages/page-026.jpg',
            'hypocycloid-pages/page-027.jpg',
            'hypocycloid-pages/page-028.jpg',
            'hypocycloid-pages/page-029.jpg',
            'hypocycloid-pages/page-030.jpg',
            'hypocycloid-pages/page-031.jpg',
            'hypocycloid-pages/page-032.jpg',
            'hypocycloid-pages/page-033.jpg',
            'hypocycloid-pages/page-034.jpg',
            'hypocycloid-pages/page-035.jpg',
            'hypocycloid-pages/page-036.jpg',
            'hypocycloid-pages/page-037.jpg',
            'hypocycloid-pages/page-038.jpg',
            'hypocycloid-pages/page-039.jpg',
            'hypocycloid-pages/page-040.jpg',
            'hypocycloid-pages/page-041.jpg',
            'hypocycloid-pages/page-042.jpg',
            'hypocycloid-pages/page-043.jpg',
            'hypocycloid-pages/page-044.jpg',
            'hypocycloid-pages/page-045.jpg',
            'hypocycloid-pages/page-046.jpg',
            'hypocycloid-pages/page-047.jpg',
            'hypocycloid-pages/page-048.jpg',
            'hypocycloid-pages/page-049.jpg',
            'hypocycloid-pages/page-050.jpg',
            'hypocycloid-pages/page-051.jpg',
            'hypocycloid-pages/page-052.jpg',
            'hypocycloid-pages/page-053.jpg',
            'hypocycloid-pages/page-054.jpg',
            'hypocycloid-pages/page-055.jpg',
            'hypocycloid-pages/page-056.jpg',
            'hypocycloid-pages/page-057.jpg',
            'hypocycloid-pages/page-058.jpg',
            'hypocycloid-pages/page-059.jpg',
            'hypocycloid-pages/page-060.jpg',
            'hypocycloid-pages/page-061.jpg',
            'hypocycloid-pages/page-062.jpg',
            'hypocycloid-pages/page-063.jpg',
            'hypocycloid-pages/page-064.jpg'
];


let currentPage = 0;


const image =
    document.getElementById("slideImage");

const counter =
    document.getElementById("pageCounter");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const slideArea =
    document.getElementById("slideArea");


/* =========================================================
   LOAD PAGE
   ========================================================= */

function showPage(index) {

    if (index < 0) {
        index = 0;
    }

    if (index >= pages.length) {
        index = pages.length - 1;
    }

    currentPage = index;

    image.src = pages[currentPage];

    counter.textContent =
        (currentPage + 1)
        + " / "
        + pages.length;


    previousButton.disabled =
        currentPage === 0;

    nextButton.disabled =
        currentPage === pages.length - 1;

}


/* =========================================================
   PREVIOUS
   ========================================================= */

previousButton.addEventListener(
    "click",
    function() {

        showPage(currentPage - 1);

    }
);


/* =========================================================
   NEXT
   ========================================================= */

nextButton.addEventListener(
    "click",
    function() {

        showPage(currentPage + 1);

    }
);


/* =========================================================
   KEYBOARD NAVIGATION
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key === "PageUp"
        ) {

            showPage(currentPage - 1);

        }


        else if (
            event.key === "ArrowRight" ||
            event.key === "PageDown" ||
            event.key === " "
        ) {

            event.preventDefault();

            showPage(currentPage + 1);

        }


        else if (
            event.key === "Home"
        ) {

            showPage(0);

        }


        else if (
            event.key === "End"
        ) {

            showPage(pages.length - 1);

        }

    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

fullscreenButton.addEventListener(
    "click",
    function() {

        if (!document.fullscreenElement) {

            if (document.documentElement.requestFullscreen) {

                document.documentElement.requestFullscreen();

            }

        }

        else {

            if (document.exitFullscreen) {

                document.exitFullscreen();

            }

        }

    }
);


/* =========================================================
   DISABLE RIGHT CLICK ON SLIDE
   ========================================================= */

image.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);


/* =========================================================
   TOUCH / SWIPE SUPPORT
   ========================================================= */

let touchStartX = 0;
let touchEndX = 0;


slideArea.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    { passive: true }
);


slideArea.addEventListener(
    "touchend",
    function(event) {

        touchEndX =
            event.changedTouches[0].screenX;

        const distance =
            touchEndX - touchStartX;


        if (Math.abs(distance) < 50) {
            return;
        }


        if (distance < 0) {

            showPage(currentPage + 1);

        }

        else {

            showPage(currentPage - 1);

        }

    },
    { passive: true }
);


/* =========================================================
   START
   ========================================================= */

showPage(0);

</script>


</body>

</html>
