<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypocycloid — Complete Presentation</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;padding:0;width:100%;height:100%;
    overflow:hidden;background:#111;
    font-family:Arial,Helvetica,sans-serif;
}
.reader{
    position:relative;width:100%;height:100vh;
    overflow:hidden;background:#111;
}
.slide-area{
    position:absolute;inset:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;background:#111;
}
#pdfCanvas{
    display:block;max-width:100%;max-height:100%;
    width:auto;height:auto;user-select:none;
    -webkit-user-select:none;
    box-shadow:0 4px 25px rgba(0,0,0,.5);
}
.reader-header{
    position:absolute;top:0;left:0;right:0;z-index:30;
    min-height:52px;display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;gap:15px;padding:8px 18px;
    color:#fff;
    background:linear-gradient(to bottom,rgba(0,0,0,.72),rgba(0,0,0,0));
    pointer-events:none;
}
.reader-header a{
    justify-self:start;color:rgba(255,255,255,.94);
    text-decoration:none;font-size:13px;font-weight:600;
    pointer-events:auto;text-shadow:0 1px 3px rgba(0,0,0,.9);
    display:none;
}
.reader-header a:hover{text-decoration:underline}
.reader-header-title{
    justify-self:center;color:#fff;font-size:14px;font-weight:700;
    text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.95);
}
.reader-header-author{
    justify-self:end;color:rgba(255,255,255,.90);
    font-size:14px;font-weight:700;text-align:right;
    text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.controls{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    z-index:40;display:flex;align-items:center;justify-content:center;
    gap:8px;padding:5px 8px;background:rgba(24,24,24,.90);
    border:1px solid rgba(255,255,255,.14);border-radius:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.control-button{
    border:none;outline:none;background:#2b2b2b;color:#fff;
    min-width:42px;height:40px;padding:0 13px;border-radius:6px;
    cursor:pointer;font-size:18px;
    transition:background .2s ease,transform .1s ease;
}
.control-button:hover{background:#444}
.control-button:active{transform:scale(.95)}
.control-button:disabled{opacity:.38;cursor:default}
.page-counter{color:#ddd;min-width:90px;text-align:center;font-size:15px;font-weight:600}
.status{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:20;color:#ddd;font-size:14px;text-align:center;padding:12px 16px;
}
.error{color:#ffb4b4;max-width:80%;line-height:1.5}
@media(max-width:700px){
    .reader-header{
        min-height:44px;grid-template-columns:auto 1fr;
        padding:7px 10px;gap:10px;
    }
    .reader-header-title{justify-self:end;font-size:12px}
    .reader-header-author{display:none}
    .reader-header a{font-size:11px}
    .controls{bottom:8px;gap:5px;padding:4px 6px;border-radius:9px}
    .control-button{min-width:36px;height:36px;padding:0 9px;font-size:17px}
    .page-counter{min-width:70px;font-size:13px}
}
:fullscreen .reader-header{min-height:58px}
:fullscreen .reader-header a{display:block}
:-webkit-full-screen .reader-header{min-height:58px}
:-webkit-full-screen .reader-header a{display:block}
</style>
</head>

<body>
<div class="reader" id="reader">

<header class="reader-header">
    <a
        href="../../engineering-curves/hypocycloid/"
        target="_top"
        title="Back to Hypocycloid"
        onclick="window.top.location.href=this.href;return false;"
    >&#10094; Back to Hypocycloid</a>

    <div class="reader-header-title">Hypocycloid — Complete Presentation</div>
    <div class="reader-header-author">Gajavada Sanjeevkumar</div>
</header>

<main class="slide-area" id="slideArea">
    <div class="status" id="status">Loading presentation…</div>
    <canvas id="pdfCanvas" aria-label="Hypocycloid presentation slide"></canvas>
</main>

<div class="controls">
    <button class="control-button" id="firstButton" title="First slide" aria-label="First slide">&#10094;&#10094;</button>
    <button class="control-button" id="previousButton" title="Previous slide" aria-label="Previous slide">&#10094;</button>
    <div class="page-counter" id="pageCounter">— / —</div>
    <button class="control-button" id="nextButton" title="Next slide" aria-label="Next slide">&#10095;</button>
    <button class="control-button" id="lastButton" title="Last slide" aria-label="Last slide">&#10095;&#10095;</button>
    <button class="control-button" id="fullscreenButton" title="Fullscreen" aria-label="Fullscreen">&#x26F6;</button>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";

const PDF_URL="./hypocycloid.pdf";

pdfjsLib.GlobalWorkerOptions.workerSrc=
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const reader=document.getElementById("reader");
const slideArea=document.getElementById("slideArea");
const canvas=document.getElementById("pdfCanvas");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const counter=document.getElementById("pageCounter");
const firstButton=document.getElementById("firstButton");
const previousButton=document.getElementById("previousButton");
const nextButton=document.getElementById("nextButton");
const lastButton=document.getElementById("lastButton");
const fullscreenButton=document.getElementById("fullscreenButton");

let pdfDocument=null;
let currentPage=1;
let renderTask=null;
let renderGeneration=0;

async function loadPDF(){
    try{
        status.textContent="Loading presentation…";
        pdfDocument=await pdfjsLib.getDocument({
            url:PDF_URL,
            disableAutoFetch:false,
            disableStream:false
        }).promise;
        status.style.display="none";
        updateButtons();
        await showPage(1);
    }catch(error){
        console.error("PDF loading error:",error);
        status.innerHTML=
            '<div class="error"><strong>Unable to load the presentation.</strong><br>'+
            'Please make sure <b>hypocycloid.pdf</b> is present in the same folder as this reader.</div>';
        status.style.display="block";
    }
}

function calculateScale(page){
    const availableWidth=Math.max(100,slideArea.clientWidth-10);
    const availableHeight=Math.max(100,slideArea.clientHeight-10);
    const viewport=page.getViewport({scale:1});
    return Math.min(
        availableWidth/viewport.width,
        availableHeight/viewport.height
    );
}

async function showPage(pageNumber){
    if(!pdfDocument)return;

    pageNumber=Math.max(1,Math.min(pageNumber,pdfDocument.numPages));
    currentPage=pageNumber;
    updateButtons();

    const generation=++renderGeneration;

    if(renderTask){
        try{renderTask.cancel()}catch(e){}
        renderTask=null;
    }

    try{
        const page=await pdfDocument.getPage(currentPage);
        if(generation!==renderGeneration)return;

        const scale=calculateScale(page);
        const viewport=page.getViewport({scale});
        const outputScale=window.devicePixelRatio||1;

        canvas.width=Math.floor(viewport.width*outputScale);
        canvas.height=Math.floor(viewport.height*outputScale);
        canvas.style.width=Math.floor(viewport.width)+"px";
        canvas.style.height=Math.floor(viewport.height)+"px";

        renderTask=page.render({
            canvasContext:ctx,
            viewport:viewport,
            transform:outputScale!==1
                ? [outputScale,0,0,outputScale,0,0]
                : null
        });

        await renderTask.promise;
        if(generation!==renderGeneration)return;

        counter.textContent=currentPage+" / "+pdfDocument.numPages;
    }catch(error){
        if(error&&error.name==="RenderingCancelledException")return;
        console.error("Page rendering error:",error);
        status.textContent="Unable to display this slide.";
        status.style.display="block";
    }
}

function updateButtons(){
    if(!pdfDocument)return;
    firstButton.disabled=currentPage<=1;
    previousButton.disabled=currentPage<=1;
    nextButton.disabled=currentPage>=pdfDocument.numPages;
    lastButton.disabled=currentPage>=pdfDocument.numPages;
    counter.textContent=currentPage+" / "+pdfDocument.numPages;
}

firstButton.addEventListener("click",()=>showPage(1));
previousButton.addEventListener("click",()=>showPage(currentPage-1));
nextButton.addEventListener("click",()=>showPage(currentPage+1));
lastButton.addEventListener("click",()=>{
    if(pdfDocument)showPage(pdfDocument.numPages);
});

document.addEventListener("keydown",event=>{
    if(event.key==="ArrowLeft"||event.key==="PageUp"){
        event.preventDefault();
        showPage(currentPage-1);
    }else if(event.key==="ArrowRight"||event.key==="PageDown"||event.key===" "){
        event.preventDefault();
        showPage(currentPage+1);
    }else if(event.key==="Home"){
        event.preventDefault();
        showPage(1);
    }else if(event.key==="End"){
        event.preventDefault();
        if(pdfDocument)showPage(pdfDocument.numPages);
    }else if(event.key==="Escape"&&document.fullscreenElement){
        document.exitFullscreen();
    }
});

fullscreenButton.addEventListener("click",async()=>{
    try{
        if(!document.fullscreenElement){
            await reader.requestFullscreen();
        }else{
            await document.exitFullscreen();
        }
    }catch(error){
        console.error("Fullscreen error:",error);
    }
});

let resizeTimer=null;
window.addEventListener("resize",()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
        if(pdfDocument)showPage(currentPage);
    },120);
});

let touchStartX=0;
let touchStartY=0;

slideArea.addEventListener("touchstart",event=>{
    const touch=event.changedTouches[0];
    touchStartX=touch.screenX;
    touchStartY=touch.screenY;
},{passive:true});

slideArea.addEventListener("touchend",event=>{
    const touch=event.changedTouches[0];
    const distanceX=touch.screenX-touchStartX;
    const distanceY=touch.screenY-touchStartY;

    if(Math.abs(distanceX)<50)return;
    if(Math.abs(distanceX)<Math.abs(distanceY))return;

    if(distanceX<0)showPage(currentPage+1);
    else showPage(currentPage-1);
},{passive:true});

loadPDF();
</script>
</body>
</html>
