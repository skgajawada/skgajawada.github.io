<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Cycloid — Presentation Reader</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b12;
    font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;
}

body{
    user-select:none;
    -webkit-user-select:none;
}

/* =========================================================
   READER
   ========================================================= */

.reader{
    position:relative;
    width:100%;
    height:100svh;
    min-height:100%;
    overflow:hidden;
    background:#080b12;
}

/* =========================================================
   SLIDE AREA
   ========================================================= */

.slide-area{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#080b12;
}

#pdfCanvas{
    display:block;

    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    background:white;

    box-shadow:
        0 8px 35px rgba(0,0,0,.55);

    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
}

/* =========================================================
   TOP OVERLAY
   ========================================================= */

.top-bar{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:20;

    min-height:58px;

    display:grid;
    grid-template-columns:1fr auto 1fr;

    align-items:center;

    padding:
        8px 18px 18px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.82),
            rgba(0,0,0,0)
        );

    color:white;

    pointer-events:none;
}

.back-button{
    justify-self:start;

    pointer-events:auto;

    color:white;
    text-decoration:none;

    font-size:13px;
    font-weight:600;

    text-shadow:
        0 1px 4px rgba(0,0,0,.9);
}

.back-button:hover{
    text-decoration:underline;
}

.reader-title{
    justify-self:center;

    color:white;

    font-size:14px;
    font-weight:700;

    text-align:center;

    text-shadow:
        0 1px 4px rgba(0,0,0,.9);
}

.author{
    justify-self:end;

    color:rgba(255,255,255,.88);

    font-size:12px;
    font-weight:600;

    text-align:right;

    text-shadow:
        0 1px 4px rgba(0,0,0,.9);
}

/* =========================================================
   BOTTOM CONTROLS
   ========================================================= */

.bottom-bar{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:20;

    display:flex;

    justify-content:center;
    align-items:end;

    padding:
        18px 12px 14px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.88),
            rgba(0,0,0,0)
        );

    pointer-events:none;
}

.controls{
    pointer-events:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    padding:7px;

    background:
        rgba(20,24,32,.94);

    border:
        1px solid rgba(255,255,255,.14);

    border-radius:12px;

    box-shadow:
        0 8px 28px rgba(0,0,0,.45);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.control{
    border:0;

    width:42px;
    height:40px;

    border-radius:7px;

    background:#2b313c;
    color:white;

    cursor:pointer;

    font-size:18px;

    transition:
        background .15s ease,
        transform .1s ease;
}

.control:hover{
    background:#414956;
}

.control:active{
    transform:scale(.94);
}

.control:disabled{
    opacity:.35;
    cursor:default;
}

.counter{
    min-width:92px;

    padding:0 8px;

    color:#f1f5f9;

    font-size:14px;
    font-weight:600;

    text-align:center;
}

/* =========================================================
   LOADING / ERROR
   ========================================================= */

.status{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    color:white;

    text-align:center;

    font-size:15px;

    padding:20px;

    max-width:90%;
}

.status.hidden{
    display:none;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

    .top-bar{
        min-height:48px;

        grid-template-columns:auto 1fr;

        padding:
            7px 10px 16px;
    }

    .reader-title{
        justify-self:end;

        font-size:12px;
    }

    .author{
        display:none;
    }

    .back-button{
        font-size:11px;
    }

    .bottom-bar{
        padding:
            12px 7px 9px;
    }

    .controls{
        gap:4px;
        padding:5px;
        border-radius:10px;
    }

    .control{
        width:36px;
        height:36px;

        font-size:16px;
    }

    .counter{
        min-width:70px;
        font-size:12px;
    }
}

/* =========================================================
   VERY SHORT LANDSCAPE
   ========================================================= */

@media(
    max-height:520px
) and (
    orientation:landscape
){

    .top-bar{
        min-height:38px;
        padding:4px 10px 10px;
    }

    .bottom-bar{
        padding:8px;
    }

    .control{
        width:34px;
        height:34px;
    }

    .counter{
        font-size:11px;
    }
}
</style>
</head>


<body>

<div class="reader">

    <!-- =====================================================
         PRESENTATION AREA
         ===================================================== -->

    <div class="slide-area" id="slideArea">

        <canvas
            id="pdfCanvas"
            aria-label="Cycloid presentation slide">
        </canvas>

    </div>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div class="status" id="status">
        Loading presentation…
    </div>


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="top-bar">

        <a
            class="back-button"
            href="../../../engineering-curves/cycloid/"
        >
            &#10094;&nbsp; Back to Cycloid
        </a>

        <div class="reader-title">
            Cycloid — Complete Presentation
        </div>

        <div class="author">
            Gajavada Sanjeevkumar
        </div>

    </header>


    <!-- =====================================================
         BOTTOM CONTROLS
         ===================================================== -->

    <footer class="bottom-bar">

        <div class="controls">

            <button
                class="control"
                id="firstButton"
                title="First slide"
                aria-label="First slide">
                &#10094;&#10094;
            </button>

            <button
                class="control"
                id="previousButton"
                title="Previous slide"
                aria-label="Previous slide">
                &#10094;
            </button>

            <div
                class="counter"
                id="counter">
                — / —
            </div>

            <button
                class="control"
                id="nextButton"
                title="Next slide"
                aria-label="Next slide">
                &#10095;
            </button>

            <button
                class="control"
                id="lastButton"
                title="Last slide"
                aria-label="Last slide">
                &#10095;&#10095;
            </button>

            <button
                class="control"
                id="fullscreenButton"
                title="Fullscreen"
                aria-label="Fullscreen">
                ⛶
            </button>

        </div>

    </footer>

</div>


<!-- =========================================================
     PDF.JS
     ========================================================= -->

<script type="module">

import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


/* =========================================================
   PDF CONFIGURATION
   ========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/*
 * The PDF is in the SAME folder as this reader.
 *
 *     cycloid/
 *       ├── cycloid.tex
 *       ├── cycloid.pdf
 *       └── cycloid-reader.html
 */

const PDF_URL = "cycloid.pdf";


/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas =
    document.getElementById("pdfCanvas");

const context =
    canvas.getContext("2d");

const slideArea =
    document.getElementById("slideArea");

const status =
    document.getElementById("status");

const counter =
    document.getElementById("counter");

const firstButton =
    document.getElementById("firstButton");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const lastButton =
    document.getElementById("lastButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* =========================================================
   STATE
   ========================================================= */

let pdf = null;

let currentPage = 1;

let rendering = false;

let pendingPage = null;


/* =========================================================
   LOAD PDF
   ========================================================= */

async function loadPDF(){

    try{

        status.textContent =
            "Loading presentation…";

        const loadingTask =
            pdfjsLib.getDocument({
                url: PDF_URL,
                disableAutoFetch: false,
                disableStream: false
            });

        pdf =
            await loadingTask.promise;


        status.classList.add("hidden");


        counter.textContent =
            `1 / ${pdf.numPages}`;


        await renderPage(1);

        updateControls();

    }

    catch(error){

        console.error(error);

        status.classList.remove("hidden");

        status.innerHTML =
            `
            <strong>Presentation could not be loaded.</strong>
            <br><br>
            Please make sure
            <strong>cycloid.pdf</strong>
            exists in the same folder as this reader.
            `;

    }

}


/* =========================================================
   CALCULATE BEST SCALE
   ========================================================= */

function calculateScale(page){

    const viewport =
        page.getViewport({
            scale:1
        });


    const availableWidth =
        slideArea.clientWidth;

    const availableHeight =
        slideArea.clientHeight;


    const widthScale =
        availableWidth / viewport.width;

    const heightScale =
        availableHeight / viewport.height;


    /*
     * Fit the complete Beamer slide inside the available
     * viewport while preserving its original aspect ratio.
     */

    let scale =
        Math.min(
            widthScale,
            heightScale
        );


    /*
     * Small safety margin prevents accidental clipping.
     */

    scale *= 0.995;


    /*
     * Limit device-pixel rendering to prevent excessive
     * memory consumption on high-DPI mobile devices.
     */

    const devicePixelRatio =
        window.devicePixelRatio || 1;


    const effectiveDPR =
        Math.min(
            devicePixelRatio,
            2
        );


    return {
        scale,
        effectiveDPR
    };

}


/* =========================================================
   RENDER PAGE
   ========================================================= */

async function renderPage(pageNumber){

    if(!pdf){
        return;
    }


    if(rendering){

        pendingPage =
            pageNumber;

        return;
    }


    rendering = true;


    try{

        const page =
            await pdf.getPage(pageNumber);


        const {
            scale,
            effectiveDPR
        } =
            calculateScale(page);


        const viewport =
            page.getViewport({
                scale
            });


        /*
         * CSS dimensions.
         */

        canvas.style.width =
            `${viewport.width}px`;

        canvas.style.height =
            `${viewport.height}px`;


        /*
         * Real drawing resolution.
         */

        canvas.width =
            Math.floor(
                viewport.width *
                effectiveDPR
            );

        canvas.height =
            Math.floor(
                viewport.height *
                effectiveDPR
            );


        context.setTransform(
            effectiveDPR,
            0,
            0,
            effectiveDPR,
            0,
            0
        );


        context.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        await page.render({

            canvasContext:context,

            viewport:viewport

        }).promise;


        currentPage =
            pageNumber;


        counter.textContent =
            `${currentPage} / ${pdf.numPages}`;


        updateControls();

    }

    catch(error){

        console.error(
            "Page rendering error:",
            error
        );

    }

    finally{

        rendering = false;


        if(pendingPage !== null){

            const nextPage =
                pendingPage;

            pendingPage = null;

            renderPage(nextPage);

        }

    }

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function goToPage(pageNumber){

    if(!pdf){
        return;
    }


    pageNumber =
        Math.max(
            1,
            Math.min(
                pdf.numPages,
                pageNumber
            )
        );


    renderPage(pageNumber);

}


function updateControls(){

    if(!pdf){
        return;
    }


    firstButton.disabled =
        currentPage <= 1;

    previousButton.disabled =
        currentPage <= 1;

    nextButton.disabled =
        currentPage >= pdf.numPages;

    lastButton.disabled =
        currentPage >= pdf.numPages;

}


/* =========================================================
   BUTTONS
   ========================================================= */

firstButton.addEventListener(
    "click",
    () => goToPage(1)
);


previousButton.addEventListener(
    "click",
    () => goToPage(currentPage - 1)
);


nextButton.addEventListener(
    "click",
    () => goToPage(currentPage + 1)
);


lastButton.addEventListener(
    "click",
    () => {

        if(pdf){
            goToPage(pdf.numPages);
        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "ArrowLeft" ||
            event.key === "PageUp"
        ){

            event.preventDefault();

            goToPage(
                currentPage - 1
            );

        }

        else if(
            event.key === "ArrowRight" ||
            event.key === "PageDown"
        ){

            event.preventDefault();

            goToPage(
                currentPage + 1
            );

        }

        else if(
            event.key === "Home"
        ){

            event.preventDefault();

            goToPage(1);

        }

        else if(
            event.key === "End"
        ){

            event.preventDefault();

            if(pdf){
                goToPage(pdf.numPages);
            }

        }

        else if(
            event.key === " "
        ){

            event.preventDefault();

            goToPage(
                currentPage + 1
            );

        }

    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try{

            if(!document.fullscreenElement){

                await document.documentElement
                    .requestFullscreen();

            }
            else{

                await document.exitFullscreen();

            }

        }
        catch(error){

            console.error(error);

        }

    }
);


/* =========================================================
   RESIZE / ROTATION
   ========================================================= */

let resizeTimer = null;

window.addEventListener(
    "resize",
    () => {

        clearTimeout(resizeTimer);

        resizeTimer =
            setTimeout(
                () => {

                    if(pdf){

                        renderPage(
                            currentPage
                        );

                    }

                },
                120
            );

    }
);


/* =========================================================
   TOUCH SWIPE
   ========================================================= */

let touchStartX = 0;
let touchStartY = 0;

slideArea.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {passive:true}
);


slideArea.addEventListener(
    "touchend",
    event => {

        const touch =
            event.changedTouches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;


        /*
         * Ignore mostly vertical gestures.
         */

        if(
            Math.abs(dx) <
            Math.abs(dy)
        ){
            return;
        }


        if(Math.abs(dx) < 50){
            return;
        }


        if(dx < 0){

            goToPage(
                currentPage + 1
            );

        }
        else{

            goToPage(
                currentPage - 1
            );

        }

    },
    {passive:true}
);


/* =========================================================
   BASIC DOWNLOAD / PRINT DETERRENCE
   ========================================================= */

document.addEventListener(
    "contextmenu",
    event => event.preventDefault()
);


document.addEventListener(
    "dragstart",
    event => event.preventDefault()
);


document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if(
            (event.ctrlKey ||
             event.metaKey)
            &&
            ["s","p","u"].includes(key)
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   START
   ========================================================= */

loadPDF();

</script>

</body>
</html>
