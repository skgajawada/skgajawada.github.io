<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Cycloid — Gajavada Sanjeevkumar</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


.reader {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background: #111;
}


/* =========================================================
   FULL-PAGE SLIDE
   The image uses the complete viewport. Header/footer are
   overlays and therefore do not reduce the slide area.
   ========================================================= */

.slide-area {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0;

    overflow: hidden;

    background: #111;
}


#slideImage {

    width: 100vw;

    height: 100vh;

    max-width: 100%;

    max-height: 100%;

    object-fit: contain;

    display: block;

    user-select: none;

    -webkit-user-drag: none;

    box-shadow:
        0 4px 25px
        rgba(0,0,0,0.5);
}


/* =========================================================
   HEADER OVERLAY
   ========================================================= */

.reader-header {

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    z-index: 30;

    min-height: 52px;

    display: grid;

    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    gap: 15px;

    padding: 8px 18px;

    color: white;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.72),
            rgba(0,0,0,0)
        );

    pointer-events: none;
}


.reader-header a {

    justify-self: start;

    color: rgba(255,255,255,0.92);

    text-decoration: none;

    font-size: 13px;

    font-weight: 600;

    pointer-events: auto;

    text-shadow:
        0 1px 3px
        rgba(0,0,0,0.9);
}


.reader-header a:hover {
    text-decoration: underline;
}


.reader-header-title {

    justify-self: center;

    color: white;

    font-size: 14px;

    font-weight: 700;

    text-align: center;

    text-shadow:
        0 1px 4px
        rgba(0,0,0,0.95);
}


.reader-header-author {

    justify-self: end;

    color: rgba(255,255,255,0.86);

    font-size: 12px;

    font-weight: 600;

    text-align: right;

    text-shadow:
        0 1px 3px
        rgba(0,0,0,0.9);
}


/* =========================================================
   FOOTER OVERLAY
   ========================================================= */

.reader-footer {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 30;

    min-height: 68px;

    display: grid;

    grid-template-columns: 1fr auto 1fr;

    align-items: end;

    gap: 15px;

    padding: 8px 18px 12px;

    color: white;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,0.82),
            rgba(0,0,0,0)
        );
}


.reader-footer-info {

    color: rgba(255,255,255,0.82);

    font-size: 11px;

    line-height: 1.4;

    text-shadow:
        0 1px 3px
        rgba(0,0,0,0.9);
}


.reader-footer-author {

    justify-self: end;

    color: rgba(255,255,255,0.82);

    font-size: 11px;

    text-align: right;

    line-height: 1.4;

    text-shadow:
        0 1px 3px
        rgba(0,0,0,0.9);
}


/* =========================================================
   FLOATING CONTROL BAR
   ========================================================= */

.controls {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding: 5px 8px;

    background: rgba(24,24,24,0.90);

    border:
        1px solid rgba(255,255,255,0.14);

    border-radius: 10px;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,0.4);

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);
}


.control-button {

    border: none;

    outline: none;

    background: #2b2b2b;

    color: white;

    min-width: 42px;

    height: 40px;

    padding: 0 13px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 18px;

    transition:
        background 0.2s ease,
        transform 0.1s ease;
}


.control-button:hover {
    background: #444;
}


.control-button:active {
    transform: scale(0.95);
}


.control-button:disabled {
    opacity: 0.38;

    cursor: default;
}


.page-counter {

    color: #ddd;

    min-width: 90px;

    text-align: center;

    font-size: 15px;

    font-weight: 600;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .reader-header {

        min-height: 44px;

        grid-template-columns: auto 1fr;

        padding: 7px 10px;

        gap: 10px;
    }

    .reader-header-title {
        justify-self: end;

        font-size: 12px;
    }

    .reader-header-author {
        display: none;
    }

    .reader-header a {
        font-size: 11px;
    }

    .reader-footer {

        min-height: 58px;

        grid-template-columns: 1fr auto;

        padding: 5px 8px 8px;

        gap: 8px;
    }

    .reader-footer-info {
        display: none;
    }

    .reader-footer-author {
        display: none;
    }

    .controls {

        gap: 5px;

        padding: 4px 6px;

        border-radius: 9px;
    }

    .control-button {

        min-width: 36px;

        height: 36px;

        padding: 0 9px;

        font-size: 17px;
    }

    .page-counter {

        min-width: 70px;

        font-size: 13px;
    }

}

</style>

</head>


<body>


<div class="reader">


    <!-- ================================================
         HEADER
         Overlay only: it does not reduce slide size.
         ================================================ -->

    <header class="reader-header">

        <a
            href="../../index.html"
            title="Back to Engineering Graphics PPT presentations"
        >
            &#10094; Back to PPT Presentations
        </a>

        <div class="reader-header-title">
            Cycloid
        </div>

        <div class="reader-header-author">
            Gajavada Sanjeevkumar
        </div>

    </header>


    <div
        class="slide-area"
        id="slideArea"
    >

        <img
            id="slideImage"
            alt="Presentation slide"
            draggable="false"
        >

    </div>


    <!-- ================================================
         FOOTER
         Overlay only: it does not reduce slide size.
         ================================================ -->

    <footer class="reader-footer">

        <div class="reader-footer-info">
            Engineering Graphics<br>
            IIT (ISM) Dhanbad
        </div>


        <div class="controls">


        <button
            class="control-button"
            id="previousButton"
            title="Previous slide"
            aria-label="Previous slide"
        >
            &#10094;
        </button>


        <div
            class="page-counter"
            id="pageCounter"
        >
            1 / 76
        </div>


        <button
            class="control-button"
            id="nextButton"
            title="Next slide"
            aria-label="Next slide"
        >
            &#10095;
        </button>


        <button
            class="control-button"
            id="fullscreenButton"
            title="Fullscreen"
            aria-label="Fullscreen"
        >
            &#x26F6;
        </button>


        </div>


        <div class="reader-footer-author">
            Gajavada Sanjeevkumar<br>
            PhD Scholar | Mechanical Engineering
        </div>

    </footer>


</div>


<script>

const pages = [
            'cycloid-pages/page-001.jpg',
            'cycloid-pages/page-002.jpg',
            'cycloid-pages/page-003.jpg',
            'cycloid-pages/page-004.jpg',
            'cycloid-pages/page-005.jpg',
            'cycloid-pages/page-006.jpg',
            'cycloid-pages/page-007.jpg',
            'cycloid-pages/page-008.jpg',
            'cycloid-pages/page-009.jpg',
            'cycloid-pages/page-010.jpg',
            'cycloid-pages/page-011.jpg',
            'cycloid-pages/page-012.jpg',
            'cycloid-pages/page-013.jpg',
            'cycloid-pages/page-014.jpg',
            'cycloid-pages/page-015.jpg',
            'cycloid-pages/page-016.jpg',
            'cycloid-pages/page-017.jpg',
            'cycloid-pages/page-018.jpg',
            'cycloid-pages/page-019.jpg',
            'cycloid-pages/page-020.jpg',
            'cycloid-pages/page-021.jpg',
            'cycloid-pages/page-022.jpg',
            'cycloid-pages/page-023.jpg',
            'cycloid-pages/page-024.jpg',
            'cycloid-pages/page-025.jpg',
            'cycloid-pages/page-026.jpg',
            'cycloid-pages/page-027.jpg',
            'cycloid-pages/page-028.jpg',
            'cycloid-pages/page-029.jpg',
            'cycloid-pages/page-030.jpg',
            'cycloid-pages/page-031.jpg',
            'cycloid-pages/page-032.jpg',
            'cycloid-pages/page-033.jpg',
            'cycloid-pages/page-034.jpg',
            'cycloid-pages/page-035.jpg',
            'cycloid-pages/page-036.jpg',
            'cycloid-pages/page-037.jpg',
            'cycloid-pages/page-038.jpg',
            'cycloid-pages/page-039.jpg',
            'cycloid-pages/page-040.jpg',
            'cycloid-pages/page-041.jpg',
            'cycloid-pages/page-042.jpg',
            'cycloid-pages/page-043.jpg',
            'cycloid-pages/page-044.jpg',
            'cycloid-pages/page-045.jpg',
            'cycloid-pages/page-046.jpg',
            'cycloid-pages/page-047.jpg',
            'cycloid-pages/page-048.jpg',
            'cycloid-pages/page-049.jpg',
            'cycloid-pages/page-050.jpg',
            'cycloid-pages/page-051.jpg',
            'cycloid-pages/page-052.jpg',
            'cycloid-pages/page-053.jpg',
            'cycloid-pages/page-054.jpg',
            'cycloid-pages/page-055.jpg',
            'cycloid-pages/page-056.jpg',
            'cycloid-pages/page-057.jpg',
            'cycloid-pages/page-058.jpg',
            'cycloid-pages/page-059.jpg',
            'cycloid-pages/page-060.jpg',
            'cycloid-pages/page-061.jpg',
            'cycloid-pages/page-062.jpg',
            'cycloid-pages/page-063.jpg',
            'cycloid-pages/page-064.jpg',
            'cycloid-pages/page-065.jpg',
            'cycloid-pages/page-066.jpg',
            'cycloid-pages/page-067.jpg',
            'cycloid-pages/page-068.jpg',
            'cycloid-pages/page-069.jpg',
            'cycloid-pages/page-070.jpg',
            'cycloid-pages/page-071.jpg',
            'cycloid-pages/page-072.jpg',
            'cycloid-pages/page-073.jpg',
            'cycloid-pages/page-074.jpg',
            'cycloid-pages/page-075.jpg',
            'cycloid-pages/page-076.jpg'
];


let currentPage = 0;


const image =
    document.getElementById("slideImage");

const counter =
    document.getElementById("pageCounter");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const slideArea =
    document.getElementById("slideArea");


/* =========================================================
   LOAD PAGE
   ========================================================= */

function showPage(index) {

    if (index < 0) {
        index = 0;
    }

    if (index >= pages.length) {
        index = pages.length - 1;
    }

    currentPage = index;

    image.src = pages[currentPage];

    counter.textContent =
        (currentPage + 1)
        + " / "
        + pages.length;


    previousButton.disabled =
        currentPage === 0;

    nextButton.disabled =
        currentPage === pages.length - 1;

}


/* =========================================================
   PREVIOUS
   ========================================================= */

previousButton.addEventListener(
    "click",
    function() {

        showPage(currentPage - 1);

    }
);


/* =========================================================
   NEXT
   ========================================================= */

nextButton.addEventListener(
    "click",
    function() {

        showPage(currentPage + 1);

    }
);


/* =========================================================
   KEYBOARD NAVIGATION
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key === "PageUp"
        ) {

            showPage(currentPage - 1);

        }


        else if (
            event.key === "ArrowRight" ||
            event.key === "PageDown" ||
            event.key === " "
        ) {

            event.preventDefault();

            showPage(currentPage + 1);

        }


        else if (
            event.key === "Home"
        ) {

            showPage(0);

        }


        else if (
            event.key === "End"
        ) {

            showPage(pages.length - 1);

        }

    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

fullscreenButton.addEventListener(
    "click",
    function() {

        if (!document.fullscreenElement) {

            if (document.documentElement.requestFullscreen) {

                document.documentElement.requestFullscreen();

            }

        }

        else {

            if (document.exitFullscreen) {

                document.exitFullscreen();

            }

        }

    }
);


/* =========================================================
   DISABLE RIGHT CLICK ON SLIDE
   ========================================================= */

image.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);


/* =========================================================
   TOUCH / SWIPE SUPPORT
   ========================================================= */

let touchStartX = 0;
let touchEndX = 0;


slideArea.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    { passive: true }
);


slideArea.addEventListener(
    "touchend",
    function(event) {

        touchEndX =
            event.changedTouches[0].screenX;

        const distance =
            touchEndX - touchStartX;


        if (Math.abs(distance) < 50) {
            return;
        }


        if (distance < 0) {

            showPage(currentPage + 1);

        }

        else {

            showPage(currentPage - 1);

        }

    },
    { passive: true }
);


/* =========================================================
   START
   ========================================================= */

showPage(0);

</script>


</body>

</html>
