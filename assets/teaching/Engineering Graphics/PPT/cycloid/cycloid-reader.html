<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Cycloid — Presentation Reader</title>

<style>

/* =========================================================
   GLOBAL
   ========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#080b12;

    font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;
}

body{
    user-select:none;
    -webkit-user-select:none;
}


/* =========================================================
   READER
   ========================================================= */

.reader{
    position:relative;

    width:100%;
    height:100vh;
    height:100svh;

    min-height:100%;

    overflow:hidden;

    background:#080b12;
}


/* =========================================================
   SLIDE AREA
   ========================================================= */

.slide-area{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#080b12;
}


/* =========================================================
   PDF CANVAS
   ========================================================= */

#pdfCanvas{

    display:block;

    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    background:#ffffff;

    box-shadow:
        0 8px 35px rgba(0,0,0,.55);

    user-select:none;
    -webkit-user-select:none;

    -webkit-user-drag:none;
}


/* =========================================================
   LOADING / ERROR STATUS
   ========================================================= */

.status{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:50;

    color:#ffffff;

    text-align:center;

    font-size:15px;

    line-height:1.6;

    padding:24px;

    width:min(500px,90%);

    border-radius:12px;

    background:
        rgba(15,23,42,.92);

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);
}

.status.hidden{
    display:none;
}

.status.error{
    background:
        rgba(127,29,29,.96);
}


/* =========================================================
   TOP OVERLAY
   ========================================================= */

.top-bar{

    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:20;

    min-height:58px;

    display:grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items:center;

    padding:
        8px 18px 18px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.82),
            rgba(0,0,0,0)
        );

    color:#ffffff;

    pointer-events:none;
}


/* =========================================================
   BACK BUTTON
   ========================================================= */

.back-button{

    justify-self:start;

    pointer-events:auto;

    color:#ffffff;

    text-decoration:none;

    font-size:13px;

    font-weight:600;

    text-shadow:
        0 1px 4px rgba(0,0,0,.9);
}

.back-button:hover{
    text-decoration:underline;
}


/* =========================================================
   TITLE
   ========================================================= */

.reader-title{

    justify-self:center;

    color:#ffffff;

    font-size:14px;

    font-weight:700;

    text-align:center;

    text-shadow:
        0 1px 4px rgba(0,0,0,.9);
}


/* =========================================================
   AUTHOR
   ========================================================= */

.author{

    justify-self:end;

    color:
        rgba(255,255,255,.88);

    font-size:12px;

    font-weight:600;

    text-align:right;

    text-shadow:
        0 1px 4px rgba(0,0,0,.9);
}


/* =========================================================
   BOTTOM CONTROLS
   ========================================================= */

.bottom-bar{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:20;

    display:flex;

    justify-content:center;
    align-items:flex-end;

    padding:
        18px 12px 14px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.88),
            rgba(0,0,0,0)
        );

    pointer-events:none;
}


.controls{

    pointer-events:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    padding:7px;

    background:
        rgba(20,24,32,.94);

    border:
        1px solid rgba(255,255,255,.14);

    border-radius:12px;

    box-shadow:
        0 8px 28px rgba(0,0,0,.45);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);
}


/* =========================================================
   BUTTONS
   ========================================================= */

.control{

    border:0;

    width:42px;
    height:40px;

    border-radius:7px;

    background:#2b313c;

    color:#ffffff;

    cursor:pointer;

    font-size:18px;

    transition:
        background .15s ease,
        transform .1s ease;
}

.control:hover{
    background:#414956;
}

.control:active{
    transform:scale(.94);
}

.control:disabled{
    opacity:.35;
    cursor:default;
}


/* =========================================================
   PAGE COUNTER
   ========================================================= */

.counter{

    min-width:92px;

    padding:
        0 8px;

    color:#f1f5f9;

    font-size:14px;

    font-weight:600;

    text-align:center;

    white-space:nowrap;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

    .top-bar{

        min-height:48px;

        grid-template-columns:
            auto 1fr;

        padding:
            7px 10px 16px;
    }

    .reader-title{

        justify-self:end;

        font-size:12px;
    }

    .author{
        display:none;
    }

    .back-button{
        font-size:11px;
    }

    .bottom-bar{

        padding:
            12px 7px 9px;
    }

    .controls{

        gap:4px;

        padding:5px;

        border-radius:10px;
    }

    .control{

        width:36px;
        height:36px;

        font-size:16px;
    }

    .counter{

        min-width:70px;

        font-size:12px;
    }
}


/* =========================================================
   VERY SHORT LANDSCAPE
   ========================================================= */

@media(
    max-height:520px
) and (
    orientation:landscape
){

    .top-bar{

        min-height:38px;

        padding:
            4px 10px 10px;
    }

    .bottom-bar{
        padding:8px;
    }

    .control{

        width:34px;
        height:34px;

        font-size:15px;
    }

    .counter{
        font-size:11px;
    }
}


/* =========================================================
   FULLSCREEN
   ========================================================= */

:fullscreen .reader{
    width:100vw;
    height:100vh;
}

:-webkit-full-screen .reader{
    width:100vw;
    height:100vh;
}

</style>
</head>


<body>


<div class="reader" id="reader">


    <!-- =====================================================
         PRESENTATION AREA
         ===================================================== -->

    <div
        class="slide-area"
        id="slideArea"
    >

        <canvas
            id="pdfCanvas"
            aria-label="Cycloid presentation slide">
        </canvas>

    </div>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div
        class="status"
        id="status"
    >
        Loading presentation…
    </div>


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="top-bar">

        <a
            class="back-button"
            href="../../../engineering-curves/cycloid/"
        >
            &#10094;&nbsp; Back to Cycloid
        </a>


        <div class="reader-title">
            Cycloid — Complete Presentation
        </div>


        <div class="author">
            Gajavada Sanjeevkumar
        </div>

    </header>


    <!-- =====================================================
         BOTTOM CONTROLS
         ===================================================== -->

    <footer class="bottom-bar">

        <div class="controls">


            <button
                class="control"
                id="firstButton"
                title="First slide"
                aria-label="First slide"
                type="button"
            >
                &#10094;&#10094;
            </button>


            <button
                class="control"
                id="previousButton"
                title="Previous slide"
                aria-label="Previous slide"
                type="button"
            >
                &#10094;
            </button>


            <div
                class="counter"
                id="counter"
                aria-live="polite"
            >
                — / —
            </div>


            <button
                class="control"
                id="nextButton"
                title="Next slide"
                aria-label="Next slide"
                type="button"
            >
                &#10095;
            </button>


            <button
                class="control"
                id="lastButton"
                title="Last slide"
                aria-label="Last slide"
                type="button"
            >
                &#10095;&#10095;
            </button>


            <button
                class="control"
                id="fullscreenButton"
                title="Fullscreen"
                aria-label="Fullscreen"
                type="button"
            >
                ⛶
            </button>


        </div>

    </footer>


</div>


<!-- =========================================================
     PDF.JS CLASSIC BUILD
     ========================================================= -->
<!-- =========================================================
     PDF.JS
     ========================================================= -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const PDF_URL = "./cycloid.pdf";

const PDFJS_CDN =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas =
    document.getElementById("pdfCanvas");

const context =
    canvas.getContext("2d");

const slideArea =
    document.getElementById("slideArea");

const status =
    document.getElementById("status");

const counter =
    document.getElementById("counter");

const firstButton =
    document.getElementById("firstButton");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const lastButton =
    document.getElementById("lastButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* =========================================================
   STATE
   ========================================================= */

let pdf = null;

let currentPage = 1;

let rendering = false;

let pendingPage = null;

let resizeTimer = null;


/* =========================================================
   PDF.JS WORKER
   ========================================================= */

if (window.pdfjsLib) {

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        PDFJS_CDN;

}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(message){

    status.classList.remove("hidden");

    status.classList.remove("error");

    status.innerHTML = message;

}


function showError(message){

    status.classList.remove("hidden");

    status.classList.add("error");

    status.innerHTML = message;

}


function hideStatus(){

    status.classList.add("hidden");

}


/* =========================================================
   ESCAPE ERROR TEXT
   ========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   LOAD PDF
   =========================================================

   IMPORTANT:

   Instead of allowing PDF.js to fetch/stream the PDF
   itself, we first fetch the complete PDF using the
   browser.

   This eliminates problems with:

   - PDF range requests
   - PDF streaming
   - worker communication
   - relative PDF loading
   - GitHub Pages PDF handling

   The PDF is still rendered one page at a time.
   ========================================================= */

async function loadPDF(){

    try{

        showStatus(
            "Loading Cycloid presentation…"
        );


        /* ---------------------------------------------
           STEP 1 — Check PDF.js
           --------------------------------------------- */

        if(
            typeof pdfjsLib === "undefined"
        ){

            throw new Error(
                "PDF.js library could not be loaded."
            );

        }


        /* ---------------------------------------------
           STEP 2 — Fetch PDF
           --------------------------------------------- */

        const response =
            await fetch(
                PDF_URL,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "PDF request failed: HTTP " +
                response.status +
                " " +
                response.statusText
            );

        }


        /* ---------------------------------------------
           STEP 3 — Convert PDF to binary data
           --------------------------------------------- */

        const arrayBuffer =
            await response.arrayBuffer();


        if(
            !arrayBuffer ||
            arrayBuffer.byteLength === 0
        ){

            throw new Error(
                "cycloid.pdf is empty."
            );

        }


        /* ---------------------------------------------
           STEP 4 — Load PDF into PDF.js
           --------------------------------------------- */

        const loadingTask =
            pdfjsLib.getDocument({

                data:
                    new Uint8Array(
                        arrayBuffer
                    ),

                /*
                 * Disable worker deliberately.
                 *
                 * This makes the reader considerably
                 * more reliable on GitHub Pages,
                 * mobile browsers and iframe contexts.
                 */

                disableWorker:true

            });


        pdf =
            await loadingTask.promise;


        /* ---------------------------------------------
           STEP 5 — Verify pages
           --------------------------------------------- */

        if(
            !pdf ||
            pdf.numPages < 1
        ){

            throw new Error(
                "The PDF contains no readable pages."
            );

        }


        /* ---------------------------------------------
           STEP 6 — Initialize reader
           --------------------------------------------- */

        currentPage = 1;

        counter.textContent =
            `1 / ${pdf.numPages}`;


        hideStatus();


        /* ---------------------------------------------
           STEP 7 — Render first slide
           --------------------------------------------- */

        await renderPage(1);


        updateControls();

    }

    catch(error){

        console.error(
            "Cycloid PDF loading error:",
            error
        );


        showError(
            `
            <strong>
                Cycloid presentation could not be loaded.
            </strong>

            <br><br>

            <small>
                ${escapeHTML(
                    error.message ||
                    "Unknown error."
                )}
            </small>

            <br><br>

            <small>
                Expected file:
                <strong>cycloid.pdf</strong>
            </small>
            `
        );

    }

}


/* =========================================================
   CALCULATE SCALE
   ========================================================= */

function calculateScale(page){

    const baseViewport =
        page.getViewport({
            scale:1
        });


    const availableWidth =
        slideArea.clientWidth;


    const availableHeight =
        slideArea.clientHeight;


    if(
        availableWidth <= 0 ||
        availableHeight <= 0
    ){

        return {
            scale:1,
            deviceRatio:1
        };

    }


    const widthScale =
        availableWidth /
        baseViewport.width;


    const heightScale =
        availableHeight /
        baseViewport.height;


    let scale =
        Math.min(
            widthScale,
            heightScale
        );


    /*
     * Small safety margin.
     */

    scale *= 0.985;


    if(
        !Number.isFinite(scale) ||
        scale <= 0
    ){

        scale = 1;

    }


    const deviceRatio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    return {
        scale,
        deviceRatio
    };

}


/* =========================================================
   RENDER PAGE
   ========================================================= */

async function renderPage(pageNumber){

    if(!pdf){

        return;

    }


    if(rendering){

        pendingPage =
            pageNumber;

        return;

    }


    rendering = true;


    try{

        const page =
            await pdf.getPage(
                pageNumber
            );


        const {
            scale,
            deviceRatio
        } =
            calculateScale(page);


        const viewport =
            page.getViewport({
                scale:scale
            });


        /* ---------------------------------------------
           CSS size
           --------------------------------------------- */

        canvas.style.width =
            viewport.width + "px";

        canvas.style.height =
            viewport.height + "px";


        /* ---------------------------------------------
           Actual canvas resolution
           --------------------------------------------- */

        canvas.width =
            Math.floor(
                viewport.width *
                deviceRatio
            );


        canvas.height =
            Math.floor(
                viewport.height *
                deviceRatio
            );


        /* ---------------------------------------------
           Clear canvas
           --------------------------------------------- */

        context.setTransform(
            1,
            0,
            0,
            1,
            0,
            0
        );


        context.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* ---------------------------------------------
           Render
           --------------------------------------------- */

        await page.render({

            canvasContext:
                context,

            viewport:
                viewport,

            transform:[
                deviceRatio,
                0,
                0,
                deviceRatio,
                0,
                0
            ]

        }).promise;


        currentPage =
            pageNumber;


        counter.textContent =
            `${currentPage} / ${pdf.numPages}`;


        updateControls();

    }

    catch(error){

        console.error(
            "Slide rendering error:",
            error
        );


        showError(
            `
            <strong>
                Unable to render slide
                ${pageNumber}.
            </strong>

            <br><br>

            <small>
                ${escapeHTML(
                    error.message ||
                    "Unknown rendering error."
                )}
            </small>
            `
        );

    }

    finally{

        rendering = false;


        if(
            pendingPage !== null
        ){

            const nextPage =
                pendingPage;

            pendingPage =
                null;

            renderPage(
                nextPage
            );

        }

    }

}


/* =========================================================
   GO TO PAGE
   ========================================================= */

function goToPage(pageNumber){

    if(!pdf){

        return;

    }


    const target =
        Math.max(
            1,

            Math.min(
                pdf.numPages,
                Number(pageNumber)
            )
        );


    renderPage(
        target
    );

}


/* =========================================================
   BUTTON STATE
   ========================================================= */

function updateControls(){

    if(!pdf){

        return;

    }


    firstButton.disabled =
        currentPage <= 1;


    previousButton.disabled =
        currentPage <= 1;


    nextButton.disabled =
        currentPage >= pdf.numPages;


    lastButton.disabled =
        currentPage >= pdf.numPages;

}


/* =========================================================
   BUTTONS
   ========================================================= */

firstButton.addEventListener(
    "click",
    () => {

        goToPage(1);

    }
);


previousButton.addEventListener(
    "click",
    () => {

        goToPage(
            currentPage - 1
        );

    }
);


nextButton.addEventListener(
    "click",
    () => {

        goToPage(
            currentPage + 1
        );

    }
);


lastButton.addEventListener(
    "click",
    () => {

        if(pdf){

            goToPage(
                pdf.numPages
            );

        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "ArrowLeft" ||
            event.key === "PageUp"
        ){

            event.preventDefault();

            goToPage(
                currentPage - 1
            );

            return;

        }


        if(
            event.key === "ArrowRight" ||
            event.key === "PageDown"
        ){

            event.preventDefault();

            goToPage(
                currentPage + 1
            );

            return;

        }


        if(
            event.key === "Home"
        ){

            event.preventDefault();

            goToPage(1);

            return;

        }


        if(
            event.key === "End"
        ){

            event.preventDefault();

            if(pdf){

                goToPage(
                    pdf.numPages
                );

            }

            return;

        }


        if(
            event.key === " "
        ){

            event.preventDefault();

            goToPage(
                currentPage + 1
            );

        }

    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try{

            if(
                !document.fullscreenElement
            ){

                await
                    document.documentElement
                        .requestFullscreen();

            }
            else{

                await
                    document.exitFullscreen();

            }

        }

        catch(error){

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {

                    if(pdf){

                        renderPage(
                            currentPage
                        );

                    }

                },
                200
            );

    }
);


/* =========================================================
   ORIENTATION
   ========================================================= */

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            () => {

                if(pdf){

                    renderPage(
                        currentPage
                    );

                }

            },
            300
        );

    }
);


/* =========================================================
   TOUCH SWIPE
   ========================================================= */

let touchStartX = 0;

let touchStartY = 0;


slideArea.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {
        passive:true
    }
);


slideArea.addEventListener(
    "touchend",
    event => {

        const touch =
            event.changedTouches[0];


        const dx =
            touch.clientX -
            touchStartX;


        const dy =
            touch.clientY -
            touchStartY;


        if(
            Math.abs(dx) <
            Math.abs(dy)
        ){

            return;

        }


        if(
            Math.abs(dx) < 50
        ){

            return;

        }


        if(dx < 0){

            goToPage(
                currentPage + 1
            );

        }
        else{

            goToPage(
                currentPage - 1
            );

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   COPY / DOWNLOAD DETERRENCE
   ========================================================= */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);


document.addEventListener(
    "dragstart",
    event => {

        event.preventDefault();

    }
);


document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if(
            (event.ctrlKey ||
             event.metaKey)
            &&
            ["s","p","u"].includes(key)
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   START
   ========================================================= */

loadPDF();

</script>

</body>
</html>
