<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hypocycloid Curve Generation Animation</title>

    <style>
        body {
            margin: 0;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .animation-container {
            width: 100%;
            max-width: 1400px;
            margin: 20px auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .controls {
            margin-top: 15px;
        }

        button {
            padding: 8px 18px;
            margin: 4px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="animation-container">

        <canvas id="hypocycloidCanvas"></canvas>

        <div class="controls">

            <button onclick="playAnimation()">
                ▶ Play
            </button>

            <button onclick="pauseAnimation()">
                ⏸ Pause
            </button>

            <button onclick="restartAnimation()">
                ↻ Restart
            </button>

        </div>

    </div>


    <!-- Your actual animation code -->
    <script src="hypocycloid.js"></script>

</body>
</html>
