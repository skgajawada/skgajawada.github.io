<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Graphics – Videos</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f8fa;
        color: #222;
    }

    .page {
        width: min(1100px, 94%);
        margin: 35px auto 50px;
    }

    .header {
        background: #ffffff;
        border: 1px solid #e1e4e8;
        border-radius: 12px;
        padding: 26px 30px;
        margin-bottom: 22px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .header h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
    }

    .header p {
        margin: 0;
        color: #666;
        font-size: 15px;
    }

    .video-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
    }

    .card {
        background: #ffffff;
        border: 1px solid #e1e4e8;
        border-radius: 12px;
        padding: 22px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 20px rgba(0,0,0,0.09);
    }

    .card h2 {
        margin: 0 0 9px;
        font-size: 20px;
    }

    .card p {
        margin: 0 0 18px;
        color: #666;
        line-height: 1.5;
        font-size: 14px;
    }

    .open-button {
        display: inline-block;
        text-decoration: none;
        background: #222;
        color: #fff;
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
    }

    .open-button:hover {
        background: #444;
    }

    .footer {
        text-align: center;
        color: #888;
        font-size: 12px;
        margin-top: 28px;
    }
</style>
</head>

<body>

<div class="page">

    <div class="header">
        <h1>Engineering Graphics – Videos</h1>
        <p>Interactive Engineering Graphics animations</p>
    </div>

    <div class="video-list">

        <div class="card">
            <h2>Hypocycloid</h2>
            <p>
                Interactive hypocycloid animation with play, pause,
                reverse, frame controls, speed control and fullscreen.
            </p>

            <a class="open-button" href="./hypocycloid.html">
                Open Animation →
            </a>
        </div>

    </div>

    <div class="footer">
        Gajavada Sanjeevkumar
    </div>

</div>

</body>
</html>
