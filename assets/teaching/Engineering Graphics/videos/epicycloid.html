<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epicycloid Animation</title>

<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .animation-page {
        width: 100%;
        max-width: 1500px;
        margin: 0 auto;
        padding: 8px 10px 12px;
    }

    .canvas-wrap {
        width: 100%;
        background: #ffffff;
        overflow: hidden;
    }

    #canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #ffffff;
        cursor: default;
    }

    .controls {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 4px 4px;
        flex-wrap: wrap;
        user-select: none;
    }

    button, select {
        height: 34px;
        border: 1px solid #b8b8b8;
        border-radius: 5px;
        background: #ffffff;
        color: #222222;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        cursor: pointer;
    }

    button {
        min-width: 38px;
        padding: 0 10px;
    }

    button:hover, select:hover { background: #f3f3f3; }
    button:active { background: #e6e6e6; }

    #playButton {
        min-width: 48px;
        font-size: 17px;
        font-weight: bold;
    }

    .speed-label {
        margin-left: 8px;
        font-size: 13px;
        color: #444;
    }

    #progress {
        flex: 1 1 250px;
        min-width: 180px;
        accent-color: #555555;
        cursor: pointer;
    }

    .time-label {
        min-width: 112px;
        text-align: right;
        font-size: 13px;
        color: #444;
    }

    .hint {
        width: 100%;
        padding: 2px 4px 0;
        font-size: 11px;
        color: #777;
    }

    @media (max-width: 650px) {
        .animation-page { padding: 4px; }
        .controls { gap: 4px; }
        button { min-width: 34px; padding: 0 7px; }
        .speed-label { margin-left: 2px; }
        .time-label { min-width: 95px; }
    }
</style>
</head>

<body>
<div class="animation-page">

    <div class="canvas-wrap">
        <canvas id="canvas" width="1400" height="788"></canvas>
    </div>

    <div class="controls">
        <button id="restartButton" title="Restart">|◀</button>
        <button id="reverseButton" title="Reverse">◀◀</button>
        <button id="backButton" title="Previous frame">◀</button>
        <button id="playButton" title="Play / Pause">▶</button>
        <button id="forwardButton" title="Next frame">▶</button>
        <button id="forwardPlayButton" title="Forward">▶▶</button>
        <button id="endButton" title="End">▶|</button>

        <span class="speed-label">Speed:</span>
        <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
        </select>

        <input id="progress" type="range" min="0" max="630" value="0" step="1">
        <span id="timeLabel" class="time-label">0 / 630</span>

        <button id="fullscreenButton" title="Fullscreen">⛶</button>

        <div class="hint">
            Space = Play/Pause &nbsp; | &nbsp; Left/Right = one frame &nbsp; |
            R = Reverse &nbsp; | &nbsp; Home/End = beginning/end
        </div>
    </div>
</div>

<script>
"use strict";

/*
    EPICYCLOID HTML ANIMATION
    --------------------------
    Browser/Canvas implementation corresponding to the supplied
    MATLAB Engineering Graphics construction.

    Dimensions:
        Directing-circle radius  = 180 mm
        Generating-circle radius = 50 mm
        Directing diameter       = 360 mm
        Generating diameter      = 100 mm
        O above base             = 15 mm
        Directing arc            = 100 degrees
        START                    = 140 degrees
        END                      = 40 degrees
        N                        = 12
        FPS                      = 30
        ROLL_FRAMES              = 20
        PAUSE_FRAMES             = 30
*/

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = 1400;
const H = 788;

const R = 180.0;
const r = 50.0;
const N = 12;
const OC = R + r;

const START_DEG = 140.0;
const TOTAL_ARC_DEG = 100.0;
const END_DEG = START_DEG - TOTAL_ARC_DEG;
const STEP_DEG = TOTAL_ARC_DEG / N;

const FPS = 30;
const ROLL_FRAMES = 20;
const PAUSE_FRAMES = FPS;
const TOTAL_FRAMES = PAUSE_FRAMES + N * (ROLL_FRAMES + PAUSE_FRAMES);

const Ox = 0.0;
const Oy = 15.0;
const START = START_DEG * Math.PI / 180.0;
const END = END_DEG * Math.PI / 180.0;
const point0Angle = START + Math.PI;

/* One colour for each corresponding O-C-k and C-k-point line. */
const lineColors = [
    "rgb(255,127,14)",
    "rgb(31,119,180)",
    "rgb(148,103,189)",
    "rgb(44,160,44)",
    "rgb(214,39,40)",
    "rgb(23,190,207)",
    "rgb(227,119,194)",
    "rgb(188,189,34)",
    "rgb(140,86,75)",
    "rgb(127,127,127)",
    "rgb(255,187,120)",
    "rgb(174,199,232)"
];

const AX = {
    left: 90,
    right: 1320,
    top: 58,
    bottom: 706
};

/* Data limits are deliberately wide enough for the complete construction. */
const XMIN = -330;
const XMAX = 330;
const YMIN = -10;
const YMAX = 310;

const DATA_W = XMAX - XMIN;
const DATA_H = YMAX - YMIN;

const PIXELS_PER_UNIT = Math.min(
    (AX.right - AX.left) / DATA_W,
    (AX.bottom - AX.top) / DATA_H
);

const DATA_CX = AX.left + (AX.right - AX.left) / 2;
const DATA_CY = AX.bottom - (-YMIN) * PIXELS_PER_UNIT;

function sx(x) {
    return DATA_CX + x * PIXELS_PER_UNIT;
}

function syCanvas(y) {
    return DATA_CY - y * PIXELS_PER_UNIT;
}

function setLine(widthPt, color, alpha = 1.0, dash = []) {
    ctx.lineWidth = widthPt * (100 / 72);
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.setLineDash(dash);
    ctx.lineCap = "butt";
    ctx.lineJoin = "round";
}

function drawLine(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(sx(x1), syCanvas(y1));
    ctx.lineTo(sx(x2), syCanvas(y2));
    ctx.stroke();
}

function drawCircle(cx, cy, rad, widthPt, color, alpha = 1.0) {
    setLine(widthPt, color, alpha);
    ctx.beginPath();
    for (let i = 0; i <= 360; i++) {
        const a = 2 * Math.PI * i / 360;
        const x = sx(cx + rad * Math.cos(a));
        const y = syCanvas(cy + rad * Math.sin(a));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
}

function drawArc(radius, a0, a1, widthPt, color, alpha = 1.0, dash = []) {
    setLine(widthPt, color, alpha, dash);
    ctx.beginPath();
    const n = 400;
    for (let i = 0; i < n; i++) {
        const f = i / (n - 1);
        const a = a0 + (a1 - a0) * f;
        const x = sx(Ox + radius * Math.cos(a));
        const y = syCanvas(Oy + radius * Math.sin(a));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
}

function drawMarker(x, y, sizePt, fill, stroke = fill) {
    const pX = sx(x);
    const pY = syCanvas(y);
    const rad = sizePt * (100 / 72) / 2;
    ctx.globalAlpha = 1;
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(pX, pY, rad, 0, 2 * Math.PI);
    ctx.fill();
}

function drawText(text, x, y, sizePt, color = "#000", weight = "normal",
                 align = "center", baseline = "middle") {
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    ctx.font = `${weight} ${sizePt * (100 / 72)}px Arial, Helvetica, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    ctx.fillText(text, sx(x), syCanvas(y));
}

function drawAxesText(text, fx, fy, sizePt, color = "#000",
                     weight = "normal", align = "center", baseline = "middle") {
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    ctx.font = `${weight} ${sizePt * (100 / 72)}px Arial, Helvetica, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    const x = AX.left + fx * (AX.right - AX.left);
    const y = AX.bottom - fy * (AX.bottom - AX.top);
    ctx.fillText(text, x, y);
}

function centreAt(t) {
    const theta = START - (STEP_DEG * Math.PI / 180) * t;
    return {
        theta,
        x: Ox + OC * Math.cos(theta),
        y: Oy + OC * Math.sin(theta)
    };
}

/*
    External rolling:
    point 0 is the inward tangency point from C0 toward O.
    alpha = ((R+r)/r) * (theta-theta0).
*/
function epicycloidPoint(t) {
    const theta = START - (STEP_DEG * Math.PI / 180) * t;
    const alpha = ((R + r) / r) * (theta - START);

    const c = centreAt(t);

    return {
        x: c.x + r * Math.cos(point0Angle + alpha),
        y: c.y + r * Math.sin(point0Angle + alpha)
    };
}

function materialAngle(i, t) {
    const alpha = ((R + r) / r) *
                  ((START - (STEP_DEG * Math.PI / 180) * t) - START);
    return point0Angle + i * 2 * Math.PI / N + alpha;
}

function animationState(frame) {
    if (frame < PAUSE_FRAMES) {
        return { t: 0, step: 0, paused: true };
    }

    const q = frame - PAUSE_FRAMES;
    const block = ROLL_FRAMES + PAUSE_FRAMES;
    const step = Math.floor(q / block);
    const local = q % block;

    if (step >= N) {
        return { t: N, step: N, paused: true };
    }

    if (local < ROLL_FRAMES) {
        const f = ROLL_FRAMES > 1 ? local / (ROLL_FRAMES - 1) : 1;
        return { t: step + f, step, paused: false };
    }

    return { t: step + 1, step: step + 1, paused: true };
}

function drawStaticBackground() {

    /* O and centre cross */
    const cross = 8;
    setLine(1.2, "#000000");
    drawLine(Ox - cross, Oy, Ox + cross, Oy);
    drawLine(Ox, Oy - cross, Ox, Oy + cross);
    drawMarker(Ox, Oy, 5, "#000000");
    drawText("O", Ox, Oy - 13, 12, "#000000", "bold");

    /* Large diagonal watermark */
    ctx.save();
    ctx.fillStyle = "rgb(210,210,210)";
    ctx.globalAlpha = 1;
    ctx.font = "bold 32px Arial, Helvetica, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.translate(DATA_CX, AX.top + (AX.bottom - AX.top) * 0.52);
    ctx.rotate(-35 * Math.PI / 180);
    ctx.fillText("Gajavada Sanjeevkumar", 0, 0);
    ctx.restore();

    /* Required directing arc only: 100 degrees */
    drawArc(R, START, END, 2.0, "#000000");

    /* Centre locus arc CD: radius R+r */
    drawArc(OC, START, END, 0.75, "rgb(80,80,80)");

    /* Directing divisions and their O-to-centre-locus construction lines */
    for (let i = 0; i <= N; i++) {
        const a = START - i * STEP_DEG * Math.PI / 180;
        const px = Ox + R * Math.cos(a);
        const py = Oy + R * Math.sin(a);
        const cx = Ox + OC * Math.cos(a);
        const cy = Oy + OC * Math.sin(a);

        setLine(0.55, "rgb(60,60,60)", 0.8);
        drawLine(Ox, Oy, cx, cy);

        drawMarker(px, py, 4, "#000000");

        const labelR = R + 10;
        drawText(`${i}'`,
            Ox + labelR * Math.cos(a),
            Oy + labelR * Math.sin(a),
            9, "#000000", "bold");
    }

    /* Final 12' line produced beyond the directing arc */
    const endLineR = R + 105;
    setLine(0.55, "#000000");
    drawLine(
        Ox, Oy,
        Ox + endLineR * Math.cos(END),
        Oy + endLineR * Math.sin(END)
    );

    /* C0...C12 on centre locus */
    for (let i = 0; i <= N; i++) {
        const a = START - i * STEP_DEG * Math.PI / 180;
        const cx = Ox + OC * Math.cos(a);
        const cy = Oy + OC * Math.sin(a);

        drawMarker(cx, cy, 4, "#000000");

        drawText(`C${i}`, cx, cy + 8, 7.5, "#333333", "normal");
    }

    const C0x = Ox + OC * Math.cos(START);
    const C0y = Oy + OC * Math.sin(START);

    /* Initial generating circle */
    drawCircle(C0x, C0y, r, 2.2, "rgb(31,119,180)", 0.75);
    drawMarker(C0x, C0y, 5, "rgb(31,119,180)");

    /* Initial generating-circle division points and same-colour division lines */
    for (let i = 0; i < N; i++) {
        const a = point0Angle + i * 2 * Math.PI / N;
        const px = C0x + r * Math.cos(a);
        const py = C0y + r * Math.sin(a);

        setLine(0.8, lineColors[i], 0.95);
        drawLine(C0x, C0y, px, py);

        drawMarker(px, py, 4, "#ffffff", lineColors[i]);

        const lr = r + 10;
        drawText(String(i),
            C0x + lr * Math.cos(a),
            C0y + lr * Math.sin(a),
            8, "#222222", "bold");
    }

    /* Point 12 is the same material point as 0 */
    const p12a = point0Angle + 2 * Math.PI;
    const p12x = C0x + r * Math.cos(p12a);
    const p12y = C0y + r * Math.sin(p12a);
    drawMarker(p12x, p12y, 4, "#ffffff", lineColors[0]);
    drawText("12", p12x - 8, p12y - 8, 8, "#222222", "bold");

    /*
       Concentric transfer arcs:
       radius = O-to-point(i), from initial point to the produced 12' line.
    */
    for (let i = 1; i <= N; i++) {
        const a = point0Angle + i * 2 * Math.PI / N;
        const px = C0x + r * Math.cos(a);
        const py = C0y + r * Math.sin(a);
        const rad = Math.hypot(px - Ox, py - Oy);
        const startA = Math.atan2(py - Oy, px - Ox);

        let delta = END - startA;
        while (delta > 0) delta -= 2 * Math.PI;
        while (delta < -2 * Math.PI) delta += 2 * Math.PI;

        drawArcAboutO(rad, startA, startA + delta, 0.55, "rgb(0,0,0)", 0.8);
    }

    /* Final D */
    const Dx = Ox + OC * Math.cos(END);
    const Dy = Oy + OC * Math.sin(END);
    drawMarker(Dx, Dy, 3.5, "#ffffff");
    drawText("D", Dx + 8, Dy - 5, 9, "#000000", "bold");
}

function drawArcAboutO(radius, a0, a1, widthPt, color, alpha = 1.0) {
    setLine(widthPt, color, alpha);
    ctx.beginPath();
    const n = 180;
    for (let i = 0; i < n; i++) {
        const f = i / (n - 1);
        const a = a0 + (a1 - a0) * f;
        const x = sx(Ox + radius * Math.cos(a));
        const y = syCanvas(Oy + radius * Math.sin(a));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
}

function drawTrace(t) {
    const samples = Math.max(2, Math.ceil(t * 24) + 1);
    setLine(2.8, "rgb(0,0,255)", 1.0);
    ctx.beginPath();

    for (let i = 0; i < samples; i++) {
        const q = t * i / (samples - 1);
        const p = epicycloidPoint(q);
        const X = sx(p.x);
        const Y = syCanvas(p.y);
        if (i === 0) ctx.moveTo(X, Y);
        else ctx.lineTo(X, Y);
    }

    ctx.stroke();
    ctx.globalAlpha = 1;
}

function drawDynamic(frame) {

    const state = animationState(frame);
    const t = state.t;
    const step = state.step;
    const paused = state.paused;

    const c = centreAt(t);
    const theta = c.theta;
    const p = epicycloidPoint(t);

    /* Epicycloid trace */
    drawTrace(t);

    /* Moving generating circle */
    const alpha = ((R + r) / r) * (theta - START);
    drawCircle(
        c.x, c.y, r, 2.5, "rgb(255,127,14)", 1.0
    );

    drawMarker(c.x, c.y, 6, "rgb(255,127,14)");

    /* Direct contact point on directing circle */
    const contactX = Ox + R * Math.cos(theta);
    const contactY = Oy + R * Math.sin(theta);
    drawMarker(contactX, contactY, 6, "rgb(220,0,0)");

    /*
       Same-colour correspondence:
       O -> C_k -> material point k.
       During rolling this line remains one continuous line.
    */
    const activeIndex = Math.min(N - 1, Math.max(0, step));
    const activeColor = lineColors[activeIndex];

    setLine(1.15, activeColor, 1.0);
    drawLine(Ox, Oy, c.x, c.y);

    const activePointAngle = point0Angle + activeIndex * 2 * Math.PI / N + alpha;
    const activePX = c.x + r * Math.cos(activePointAngle);
    const activePY = c.y + r * Math.sin(activePointAngle);

    /* At a pause, use the exact corresponding material point. */
    if (paused && step <= N) {
        const exactAngle = point0Angle + step * 2 * Math.PI / N + alpha;
        const ex = c.x + r * Math.cos(exactAngle);
        const ey = c.y + r * Math.sin(exactAngle);
        setLine(1.15, activeColor, 1.0);
        drawLine(c.x, c.y, ex, ey);
    } else {
        setLine(1.15, activeColor, 1.0);
        drawLine(c.x, c.y, activePX, activePY);
    }

    /* Moving division lines: each keeps its corresponding colour. */
    for (let i = 0; i < N; i++) {
        const a = materialAngle(i, t);
        const px = c.x + r * Math.cos(a);
        const py = c.y + r * Math.sin(a);

        setLine(0.75, lineColors[i], 0.72);
        drawLine(c.x, c.y, px, py);
        drawMarker(px, py, 3.8, "#ffffff", lineColors[i]);

        const lr = r + 10;
        drawText(
            i === 0 ? "0" : String(i),
            c.x + lr * Math.cos(a),
            c.y + lr * Math.sin(a),
            8, "#222222", "bold"
        );
    }

    /* C label */
    drawText(`C${step}`, c.x, c.y - 10, 9, "#000000", "bold");

    /* Dynamic trace point */
    drawMarker(p.x, p.y, 7, "rgb(0,0,255)");

    /* Top-left information */
    drawAxesText(
        `C${step} : ${step} coincides with ${step}'`,
        0.03, 0.965, 10.5, "#222222", "bold", "left", "top"
    );

    const coveredAngle = Math.abs((theta - START) * 180 / Math.PI);
    drawAxesText(
        `Directing arc covered at O: ${coveredAngle.toFixed(3)} deg`,
        0.03, 0.925, 10.5, "#222222", "bold", "left", "top"
    );

    const revolution = Math.min(360, coveredAngle / TOTAL_ARC_DEG * 360);
    drawAxesText(
        `Generating circle revolution = ${revolution.toFixed(3)} deg`,
        0.03, 0.885, 10.5, "#222222", "bold", "left", "top"
    );
}

function drawTitleAndFooter() {
    drawAxesText("Epicycloid", 0.50, 0.995, 15, "#000000", "bold");
    drawAxesText(
        "Gajavada Sanjeevkumar",
        0.025, 0.012, 11, "#000000", "bold", "left", "bottom"
    );
    drawAxesText(
        "Engineering Curve: Epicycloid",
        0.975, 0.012, 11, "#000000", "bold", "right", "bottom"
    );
}

function render() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);

    drawStaticBackground();
    drawDynamic(currentFrame);
    drawTitleAndFooter();

    ctx.restore();

    document.getElementById("progress").value = currentFrame;
    document.getElementById("timeLabel").textContent =
        `${currentFrame} / ${TOTAL_FRAMES}`;
    document.getElementById("playButton").textContent =
        playing ? "❚❚" : "▶";
}

/* Playback */
let currentFrame = 0;
let playing = false;
let direction = 1;
let speed = 1.0;
let lastTime = null;
let frameAccumulator = 0;

function animationLoop(now) {
    if (!playing) {
        lastTime = now;
        requestAnimationFrame(animationLoop);
        return;
    }

    if (lastTime === null) lastTime = now;

    const elapsed = Math.min(100, now - lastTime);
    lastTime = now;
    frameAccumulator += elapsed * FPS * speed / 1000.0;

    while (frameAccumulator >= 1.0) {
        currentFrame += direction;
        frameAccumulator -= 1.0;

        if (currentFrame >= TOTAL_FRAMES - 1) {
            currentFrame = TOTAL_FRAMES - 1;
            if (direction > 0) {
                playing = false;
                break;
            }
        }

        if (currentFrame <= 0) {
            currentFrame = 0;
            if (direction < 0) {
                playing = false;
                break;
            }
        }
    }

    render();
    requestAnimationFrame(animationLoop);
}

function playForward() {
    direction = 1;
    if (currentFrame >= TOTAL_FRAMES - 1) currentFrame = 0;
    playing = true;
    lastTime = null;
}

function playReverse() {
    direction = -1;
    if (currentFrame <= 0) currentFrame = TOTAL_FRAMES - 1;
    playing = true;
    lastTime = null;
}

function togglePlay() {
    if (playing) {
        playing = false;
    } else if (direction < 0) {
        playReverse();
    } else {
        playForward();
    }
}

function stepFrame(amount) {
    playing = false;
    currentFrame += amount;
    currentFrame = Math.max(0, Math.min(TOTAL_FRAMES - 1, currentFrame));
    render();
}

document.getElementById("playButton").addEventListener("click", togglePlay);
document.getElementById("reverseButton").addEventListener("click", playReverse);
document.getElementById("forwardPlayButton").addEventListener("click", playForward);
document.getElementById("backButton").addEventListener("click", () => stepFrame(-1));
document.getElementById("forwardButton").addEventListener("click", () => stepFrame(1));

document.getElementById("restartButton").addEventListener("click", () => {
    playing = false;
    direction = 1;
    currentFrame = 0;
    render();
});

document.getElementById("endButton").addEventListener("click", () => {
    playing = false;
    direction = 1;
    currentFrame = TOTAL_FRAMES - 1;
    render();
});

document.getElementById("progress").addEventListener("input", event => {
    playing = false;
    currentFrame = Number(event.target.value);
    render();
});

document.getElementById("speed").addEventListener("change", event => {
    speed = Number(event.target.value);
});

document.getElementById("fullscreenButton").addEventListener("click", async () => {
    const wrapper = document.querySelector(".animation-page");
    try {
        if (!document.fullscreenElement) await wrapper.requestFullscreen();
        else await document.exitFullscreen();
    } catch (e) {}
});

document.addEventListener("keydown", event => {
    if (event.target.tagName === "SELECT" || event.target.tagName === "INPUT") return;

    if (event.code === "Space") {
        event.preventDefault();
        togglePlay();
    } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        stepFrame(-1);
    } else if (event.key === "ArrowRight") {
        event.preventDefault();
        stepFrame(1);
    } else if (event.key.toLowerCase() === "r") {
        event.preventDefault();
        playReverse();
    } else if (event.key === "Home") {
        event.preventDefault();
        playing = false;
        currentFrame = 0;
        render();
    } else if (event.key === "End") {
        event.preventDefault();
        playing = false;
        currentFrame = TOTAL_FRAMES - 1;
        render();
    }
});

render();
requestAnimationFrame(animationLoop);

</script>
</body>
</html>
